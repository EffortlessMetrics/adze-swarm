[package]
name = "adze"
version = "0.9.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Steven Zimmerman, CPA"]
description = "Define tree-sitter grammars alongside Rust logic with AST-first parsing"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/effortlessmetrics/adze"
homepage = "https://github.com/effortlessmetrics/adze"
documentation = "https://docs.rs/adze"
readme = "README.md"
publish = true
keywords = ["parsing", "codegen", "grammar", "tree-sitter", "glr"]
categories = ["development-tools", "parsing"]
include = ["Cargo.toml", "LICENSE*", "README*", "src/**", "build.rs", "benches/**", "examples/**"]

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pure-rust"]
pure-rust = ["adze-macro/pure-rust", "adze-bdd-governance-core/pure-rust"]
tree-sitter-c2rust = ["tree-sitter-runtime-c2rust", "adze-bdd-governance-core/tree-sitter-c2rust"]
tree-sitter-standard = ["dep:tree-sitter-runtime-standard", "adze-bdd-governance-core/tree-sitter-standard"]
wasm = ["wasm-bindgen", "pure-rust"]
simd = ["pure-rust"]
serialization = ["serde", "serde_json", "adze-glr-core/serialization"] # Enable tree serialization
legacy-parsers = [] # Enable to access deprecated parser_v2 and parser_v3 modules
incremental_glr = [] # Enable GLR incremental parsing support
debug_glr = [] # Enable debug output for GLR parser
ts-compat = ["adze-example/ts-compat"] # Enable Tree-sitter compatibility API
debug_incremental = [] # Enable debug output for incremental parsing
experimental_examples = [] # Enable experimental examples that use internal APIs
json_example = [] # Enable JSON parser example (separate from other examples)
external_scanners = [] # Enable external scanner support (feature-gated)
query = [] # Enable query predicates support
runtime-e2e = [] # Opt-in integration tests that exercise end-to-end parsing paths
strict_docs = [] # Enable strict documentation requirements
strict_api = [] # Enable strict API surface checking
unstable-benches = [] # Enable benchmarks that depend on unstable APIs
glr_telemetry = [] # Enable GLR telemetry
glr = ["adze-bdd-governance-core/glr"] # Enable GLR parser mode
with-grammars = ["dep:tree_sitter_json", "dep:tree-sitter-runtime-standard"] # Enable tests that require ts-bridge and tree-sitter grammars

[dependencies]
tree-sitter-runtime-c2rust = { package = "tree-sitter-c2rust", version = "0.25.2", optional = true }
tree-sitter-runtime-standard = { package = "tree-sitter", version = "0.25.8", optional = true }
adze-macro = { version = "0.9.0", path = "../macro" }
adze-ir = { version = "0.9.0", path = "../ir" }
adze-glr-core = { version = "0.9.0", path = "../glr-core" }
adze-tablegen = { version = "0.9.0", path = "../tablegen" }
regex = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
once_cell = "1.19"
thiserror = { workspace = true }
rayon = { workspace = true }
ahash = { version = "0.8.12", default-features = false, features = ["std"] }
log = "0.4.27"
smallvec.workspace = true
wasm-bindgen = { version = "0.2.100", optional = true }
adze-linecol-core = { version = "0.1.0", path = "../crates/linecol-core" }
tree_sitter_json = { package = "tree-sitter-json", version = "0.24", optional = true }
adze-bdd-governance-core = { version = "0.1.0", path = "../crates/bdd-governance-core" }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
criterion.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
hex = "0.4"
ts_bridge = { package = "ts-bridge", path = "../tools/ts-bridge" }
glr-test-support = { path = "../glr-test-support" }
adze-example = { path = "../example" }
adze-python-simple = { path = "../grammars/python-simple" }
adze-python = { path = "../grammars/python" }
# Enables Forest::from_parse_forest_for_test for #930 constructed-forest adapter proof.
adze-glr-core = { version = "0.9.0", path = "../glr-core", features = ["test-api"] }

[[bench]]
name = "simple_bench"
harness = false

[[bench]]
name = "parser_benchmark"
harness = false
required-features = ["unstable-benches"]

[[bench]]
name = "glr_parser_bench"
harness = false

[[bench]]
name = "incremental_parsing"
harness = false
required-features = ["unstable-benches"]

[[bench]]
name = "incremental_benchmark"
harness = false
required-features = ["unstable-benches"]

[[bench]]
name = "incremental_simple"
harness = false
required-features = ["unstable-benches"]

[[bench]]
name = "parser_bench"
harness = false
required-features = ["unstable-benches"]

[[bench]]
name = "perf_benchmark"
harness = false
required-features = ["unstable-benches"]

[[example]]
name = "external_scanner_demo"
required-features = ["experimental_examples"]

[[example]]
name = "diagnostics_recovery"
required-features = ["pure-rust", "glr", "serialization"]

[[example]]
name = "glr_ambiguity"
required-features = ["pure-rust", "glr"]

[[example]]
name = "glr_incremental_demo"
required-features = ["experimental_examples", "incremental_glr"]

[[example]]
name = "glr_incremental_simple"
required-features = ["experimental_examples", "incremental_glr"]

[[example]]
name = "incremental_demo"
required-features = ["experimental_examples"]

[[example]]
name = "json_parser_example"
required-features = ["json_example"]

[[example]]
name = "predicate_demo"
required-features = ["experimental_examples"]

[[example]]
name = "pure_parser_demo"
required-features = ["experimental_examples", "pure-rust"]

[[example]]
name = "lang_probe"
required-features = ["experimental_examples"]

[[example]]
name = "pr58_features_demo"
required-features = ["ts-compat"]

[[example]]
name = "query_demo"
required-features = ["query"]

[[example]]
name = "query_highlighting"
required-features = ["query"]

[[example]]
name = "validation_demo"
required-features = ["experimental_examples"]
