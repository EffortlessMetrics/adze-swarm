id = "adze-release-candidate-bundle-readiness"
title = "Adze Release Candidate Bundle Readiness"
status = "active"
owner = "release/product"
created = "2026-05-29"

objective = """
Prepare adze-swarm to produce a deliberate, non-publish release-candidate
bundle that a maintainer can review before any public adze promotion or release
authorization. The bundle must make the selected swarm commit, proof receipts,
claim boundaries, public drift state, rollback path, and blocked release actions
explicit without tagging, publishing, signing, using Cargo tokens, or claiming
crates.io install support.
"""

handoff = """
This is a non-release adze-swarm lane selected from the paused forge standby
state tracked by EffortlessMetrics/adze-swarm#549. Release, publish, signing,
Cargo-token, public promotion PR, and real crates.io install receipt work remain
blocked on explicit authorization tracked by EffortlessMetrics/adze-swarm#325.
"""

end_state = [
  "adze-swarm remains the development, proof, CI, and release-candidate factory.",
  "public adze remains the public release, intake, promotion, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "A selected adze-swarm release-candidate commit can be reviewed with a concrete bundle of proof commands, claim boundaries, public drift state, and rollback notes.",
  "The bundle distinguishes non-publish preflight receipts from post-publish crates.io install receipts.",
  "No public adze promotion PR, release tag, cargo publish, signing workflow, Cargo-token work, or crates.io install command is authorized by this lane.",
  "No cargo install, Tree-sitter parity, query parity, incremental performance, GLR generality, or benchmark performance claim is broadened without a real receipt.",
  "AdzeDocument remains the canonical parse product; public views remain projections over that document.",
]

