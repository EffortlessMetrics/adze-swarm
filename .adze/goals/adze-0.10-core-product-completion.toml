id = "adze-0.10-core-product-completion"
title = "Adze 0.10.0 Core Product Completion"
status = "active"
owner = "release/product"
created = "2026-07-19"

objective = """
Coordinate the bounded correctness, architecture, product-proof, packaging,
usability, and performance work needed before Adze enters its 0.10.0 freeze.
This is not a 1.0 freeze: it freezes selected 0.10.0 release-candidate behavior
and claim boundaries only. Work stays in adze-swarm; public adze remains the
promotion, release, tag, publish, signing, Cargo-token, and crates.io receipt
surface. AdzeDocument remains the one parse truth.

Gate A — usable early-adopter candidate: coherent package-first journey and no
known P0 defect in the advertised core lane (#848, #849, #883, #854, #855,
#857, #874, #856, starter numeric safety, and grammar/GLR/diagnostic matrices).

Gate B — useful 0.10.0 core freeze: one deterministic engine and one GLR
engine, explicit compiler metadata, canonical flat document storage and
outcomes, one semantic language schema, document-backed ts-compat and query,
projection equivalence, contract matrices, bounded fuzz/property receipts,
fallible extraction, blocking no-panic coverage, intentional pre-1.0 public
facade, and compile-tested examples.

Gate C — 0.10.0 freeze handoff and promotion readiness: exact package-first
receipts on required platforms, honest CLI capability boundaries, honest CI
routing without #598 policy drift, fixed-runner performance baselines,
support-tier/docs closeout on one source commit, read-only swarm-to-public
promotion packet (#881), and explicit human release choice in #325.
"""

handoff = """
Parent campaign: #853. Research/control board: #617. Release authority: #325.
Runner evidence and quarantine policy: #598.

#848 trailing-NUL input-loss and #849 DevEx hook/tooling repair are merged.
#884 closed the #849 pre-push GOTO diagnostic follow-up. This control-plane
reset (#883) makes #853 the checked-in active goal and selects exactly one
bounded implementation slice at a time.

After #883 lands, activate #854 Stable Product Proof correction as the sole
implementation slice. Do not mark multiple overlapping implementation issues
active simultaneously. Refresh the open PR queue before starting each slice.
Release, publish, signing, Cargo-token, public promotion, and crates.io install
work remain blocked on explicit human authorization in #325. Runner
fallback/quarantine changes remain infrastructure decisions tracked by #598.
"""

end_state = [
  "adze-swarm remains the development, proof, CI, and release-candidate factory.",
  "public adze remains the promotion, release, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "Gate A is complete: usable early-adopter candidate with package-first journey and no known P0 core-lane defect.",
  "Gate B is complete or explicitly maintainer-deferred with user-facing non-claims recorded in #853 and KNOWN_RED.",
  "Gate C is complete: promotion-ready RC handoff packet exists and #325 records the explicit human release decision.",
  "#848 trailing-NUL input-loss fix is merged with parser-level proof.",
  "#849 DevEx hook/tooling repair is merged or otherwise resolved.",
  "#854 proves every declared Stable Product Proof canary actually executes.",
  "#855 produces one exact Cargo/policy/release crate graph.",
  "#857 replaces fixed state-0 true-GLR pretokenization with stack-aware streaming lexing.",
  "#874 proves the first-hour init -> test -> parse -> parse_document -> invalid input path.",
  "Release and install authorization remains blocked on #325 until a separate explicit human decision.",
  "#598 remains the standing runner evidence and infrastructure decision issue.",
  "No 1.0 freeze, support-tier promotion, or public adze implementation is authorized by this campaign alone.",
