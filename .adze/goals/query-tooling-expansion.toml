id = "adze-query-tooling-expansion"
title = "Adze Query and Tooling Expansion"
status = "active"
owner = "droid-factory"
created = "2026-05-20"

objective = """
Continue non-release product work by making query and tooling behavior easier
to exercise, understand, and prove while keeping Tree-sitter query
compatibility a documented subset and keeping release/publish work blocked on
explicit authorization.
"""

end_state = [
  "adze-swarm remains the operating repo for non-release development and proof work.",
  "public adze remains release/public-intake/publish surface unless explicitly promoted or release-authorized.",
  "release/publish/signing/Cargo-token work remains blocked on issue #325 until explicitly authorized.",
  "query examples and CLI/tooling smoke receipts exercise supported subset behavior.",
  "source-aware and source-free query behavior stays explicit.",
  "known query/tooling gaps are recorded rather than hidden or overclaimed.",
  "support-tier wording changes only after proof commands exist.",
]

