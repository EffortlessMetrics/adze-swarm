id = "query-upstream-differential"
title = "Query Upstream Differential Canary"
status = "active"
owner = "runtime/query"
created = "2026-05-31"

objective = """
Add the first upstream Tree-sitter query differential canary for the documented
Adze query subset. Keep this as a proof spike selected from the research board:
one grammar, one source input, one supported-subset query shape, and one
explicit comparison between upstream Tree-sitter captures and Adze captures.
"""

handoff = """
This is a non-release adze-swarm lane selected from the research board in
EffortlessMetrics/adze-swarm#617 and the bounded proof issue
EffortlessMetrics/adze-swarm#643. It does not authorize full query parity,
support-tier promotion, public adze development, release, publish, signing,
Cargo-token, or crates.io install receipt work.
"""

end_state = [
  "adze-swarm remains the operating repo for this proof spike.",
  "public adze remains release, public intake, promotion, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "A single upstream Tree-sitter grammar/input/query slice compares upstream captures with Adze captures.",
  "The chosen query stays inside the documented supported subset in ADZE-SPEC-0013.",
  "The canary records upstream crate/version, source input, query pattern, expected captures, and Adze captures.",
  "No full Tree-sitter query parity, directive/highlighting/injection, GLR-forest-wide query matching, or broad imported grammar corpus claim is made.",
  "Release, publish, signing, Cargo-token, public promotion, and crates.io install-receipt work remain blocked on #325.",
]

