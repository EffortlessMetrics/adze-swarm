id = "adze-cli-parse-surface-hardening"
title = "Adze CLI Parse Surface Hardening"
status = "complete"
owner = "cli/product"
created = "2026-05-21"
archived = "2026-05-21"

objective = """
Make the checked-out `adze parse` command more useful without changing release
claims: harden static selected-tree output through generated `parse_document()`,
keep document projection modes proof-backed, and preserve honest boundaries for
dynamic parse, stable schemas, and crates.io install claims.
"""

handoff = """
Release and crates.io install work remains blocked on explicit human
authorization tracked by EffortlessMetrics/adze-swarm#325. This active goal is
the non-release continuation lane for CLI parse-surface hardening in
adze-swarm.
"""

end_state = [
  "adze-swarm remains the operating repo for CLI implementation and proof work.",
  "public adze remains the release, public-intake, promotion, tag, publish, signing, and Cargo-token surface.",
  "No release tag, crate publish, signing, Cargo-token, or crates.io install-receipt work happens in this lane.",
  "Static CLI parse output uses generated parse_document() rather than a second parse truth.",
  "Existing document projection modes keep their schema-envelope and recovery-diagnostics receipts.",
  "Unsupported modes fail explicitly until behavior and support-tier proof land.",
  "Stable CLI/WASM schema claims are not promoted without proof receipts and source-of-truth updates.",
]

