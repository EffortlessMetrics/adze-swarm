  "generated external-token malformed-input coverage is expanded with parse()/parse_document() diagnostic agreement.",
  "parser-v4 external-scanner diagnostic canaries prove source-bounded document diagnostics and invalid emitted-token rejection.",
  "support-tier and product-audit wording is refreshed only after proof commands exist.",
  "external scanners remain Experimental unless a later support-tier review promotes a proven slice.",
]

