objective = """
Close the named non-release product-trust gap around parser-generated
external-scanner recovery by adding focused generated-parser and parser-v4
diagnostic proof while keeping external scanners Experimental until support
tiers explicitly promote a proven slice.
"""

end_state = [
  "adze-swarm remains the operating repo for non-release development and proof work.",
