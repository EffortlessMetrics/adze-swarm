id = "adze-toolkit-excellence"
title = "Adze Toolkit Excellence and Adoption"
status = "complete"
owner = "droid-factory"
created = "2026-05-18"

objective = """
Convert the completed GLR toolkit foundation into a cohesive, easy-to-use
product by proving end-to-end user workflows, tightening docs-to-code
alignment, hardening examples and CLI flows, validating Tree-sitter, query,
diagnostic, JSON, and performance receipts, and promoting only
support-tier-backed claims.
"""

end_state = [
  "A new user can initialize, build, test, and parse with one obvious path.",
  "The generated parser API is the default public story.",
  "AdzeDocument is the obvious tooling story and remains the one parse truth.",
  "Tree-sitter-compatible selected-tree output is documented and tested as a subset.",
  "Query compatibility has examples and known gaps.",
  "Diagnostics and ambiguity behavior are taught with runnable examples.",
  "Benchmarks produce receipts, not marketing claims.",
  "README, book, and reference docs match support-tier proof.",
  "Public adze remains release/intake, not swarm work.",
]

