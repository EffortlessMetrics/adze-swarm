id = "adze-cli-static-sexp-output"
title = "Adze CLI Static S-Expression Output"
status = "complete"
owner = "cli/product"
created = "2026-05-21"
archived = "2026-05-21"

objective = """
Make static `adze parse --output sexp` useful without changing release claims:
render a selected-tree S-expression through generated `parse_document()`, keep
remaining unsupported static modes explicit, and preserve honest boundaries for
dynamic parse, stable schemas, and crates.io install claims.
"""

handoff = """
Release and crates.io install work remains blocked on explicit human
authorization tracked by EffortlessMetrics/adze-swarm#325. This active goal is
the non-release continuation lane for static CLI S-expression output in
adze-swarm.
"""

end_state = [
  "adze-swarm remains the operating repo for CLI implementation and proof work.",
  "public adze remains the release, public-intake, promotion, tag, publish, signing, and Cargo-token surface.",
  "No release tag, crate publish, signing, Cargo-token, or crates.io install-receipt work happens in this lane.",
  "Static CLI S-expression output uses generated parse_document() rather than a second parse truth.",
  "Default tree output and document projection modes keep their existing receipts.",
  "json and dot static modes fail explicitly until behavior and support-tier proof land.",
  "Stable CLI/WASM schema claims are not promoted without proof receipts and source-of-truth updates.",
]

