id = "adze-adoption-hardening"
title = "Adze Adoption Hardening"
status = "active"
owner = "runtime/product"
created = "2026-05-29"

objective = """
Make the already-proven GLR toolkit easier to adopt, easier to understand,
and safer to promote by refreshing starter-project UX, downstream fixtures,
API choice guidance, GLR ambiguity, diagnostics/recovery, query,
Tree-sitter-compatible selected-tree guidance, benchmark receipts, and
release-boundary discipline. Keep all work in adze-swarm and keep public adze
reserved for explicit promotion or release work.
"""

handoff = """
This is a non-release adze-swarm lane selected from the paused forge standby
state tracked by EffortlessMetrics/adze-swarm#549. Release, publish, signing,
Cargo-token, public promotion PR, and real crates.io install receipt work remain
blocked on explicit authorization tracked by EffortlessMetrics/adze-swarm#325.
"""

end_state = [
  "adze-swarm remains the development, proof, CI, and release-candidate factory.",
  "public adze remains the public release, intake, promotion, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "First-use starter and downstream workflows are easy to inspect and backed by focused proof commands.",
  "API choice guidance keeps grammar::parse as the beginner path and grammar::parse_document / AdzeDocument as the tooling path.",
  "GLR ambiguity, diagnostics/recovery, query, and Tree-sitter-compatible selected-tree guidance name their supported subsets and known gaps.",
  "Benchmark and performance guidance records receipts without stable speed, memory, parity, or release-blocking claims.",
  "Support-tier rows, README/book wording, examples, proof commands, and known limitations remain aligned before any public claim broadens.",
  "No release tag, crate publish, signing, Cargo-token, or crates.io install receipt work is authorized by this lane.",
  "No cargo-install, Tree-sitter parity, query parity, incremental performance, GLR generality, or benchmark performance claim is broadened without a real receipt.",
  "AdzeDocument remains the canonical parse product; public views remain projections over that document.",
]

