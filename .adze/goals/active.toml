id = "first-use-starter-workspace-hardening"
title = "First-Use Starter Workspace Hardening"
status = "paused"
owner = "cli/product"
created = "2026-06-05"

objective = """
Close the #680 diagnostic wording polish slice selected after #682/#683
completed starter workspace robustness. The lane made bad-input first-use
diagnostics less misleading by changing non-EOF invalid source bytes so a
byte-span over the offending byte does not render as `end`, while preserving
true EOF wording, expected-token text, byte/point spans, and support-tier
boundaries. It did not touch release, publish, signing, Cargo-token, public
adze, workflow, router, starter manifest, or support-tier surfaces.
"""

handoff = """
Start from #617 and #680. The selected implementation item
`starter-workspace-escape` was merged in #682 and made generated starter
manifests standalone workspace roots with a focused nested-parent-workspace CLI
test. The selected diagnostic implementation item
`diagnostic-wording-polish` was merged in #686 and keeps non-EOF invalid source
bytes such as `1 + @` from rendering as EOF/end while preserving true EOF
wording, expected-token text, byte/point span contracts, UTF-8/multiline
behavior, and document diagnostic projection coverage. No non-release
implementation item is active or ready; return to #617 for the next decision
packet before opening more implementation work. If release, promotion, tag,
publish, signing, Cargo-token, crates.io install, public adze implementation,
workflow/router changes, broad CI fanout, starter manifest changes, or
support-tier promotion is requested, stop unless a separate source-of-truth
issue explicitly selects that lane.
"""

end_state = [
  "adze-swarm remains the operating repo for non-release implementation, proof, source-of-truth, CI, examples, docs-proof, runtime, tablegen, query, diagnostics, and performance work.",
  "public adze remains the release, public-intake, promotion, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "#680 starter workspace robustness was selected from the current research board and merged by #682.",
  "Generated starter manifests include an empty [workspace] table so nested first-use projects build without parent workspace edits.",
  "The merged implementation diff was limited to cli/src/main.rs and one focused CLI test in cli/tests/cli_test.rs.",
  "#680 diagnostic wording polish was selected from the current research board and merged by #686.",
  "Non-EOF invalid source bytes are not presented as EOF/end while true EOF diagnostics keep EOF/end wording.",
  "Expected-token text, byte spans, point ranges, UTF-8/multiline behavior, and document diagnostic range agreement remain preserved.",
  "No runtime/parser/API/workflow/router/release/public-adze/support-tier/publish/signing/Cargo-token/crates.io install claim is authorized.",
  "Required PR proof passed through Rust Small Result, Product Proof Result, PR Gate Success, and focused diagnostic commands named by #680.",
  "Release and install authorization remains blocked on #325 until a separate explicit human decision selects the public adze release path.",
]

