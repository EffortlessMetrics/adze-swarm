id = "adze-cli-static-json-dot-output"
title = "Adze CLI Static JSON And DOT Output"
status = "active"
owner = "cli/product"
created = "2026-05-21"

objective = """
Make static `adze parse --output json` and `adze parse --output dot` useful
without changing release claims: route both through generated
`parse_document()`, keep dynamic parse and stable schema claims explicit, and
preserve crates.io install boundaries.
"""

handoff = """
Release and crates.io install work remains blocked on explicit human
authorization tracked by EffortlessMetrics/adze-swarm#325. This active goal is
the non-release continuation lane for static CLI JSON and DOT output in
adze-swarm.
"""

end_state = [
  "adze-swarm remains the operating repo for CLI implementation and proof work.",
  "public adze remains the release, public-intake, promotion, tag, publish, signing, and Cargo-token surface.",
  "No release tag, crate publish, signing, Cargo-token, or crates.io install-receipt work happens in this lane.",
  "Static CLI JSON and DOT output use generated parse_document() rather than a second parse truth.",
  "Tree, S-expression, and document projection modes keep their existing receipts.",
  "Stable CLI/WASM schema claims are not promoted without proof receipts and source-of-truth updates.",
]

