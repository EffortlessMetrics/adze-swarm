id = "adze-swarm-forge-standby"
title = "Adze-swarm Forge Standby"
status = "paused"
owner = "repo-governance"
created = "2026-05-29"

objective = """
Keep adze-swarm in a clean development/proof-forge standby state while no
non-release implementation lane is selected. Preserve the split where
adze-swarm is the development, proof, CI, and release-candidate factory, while
public adze remains the release, public intake, tag, publish, signing,
Cargo-token, and crates.io receipt surface.
"""

pause_reason = """
The near-term CI governance work has landed: CI-efficiency invariants,
self-hosted swarm workflow routing, runner/tooling follow-ups, duplicate queue
cleanup, the durable adze-swarm operating-model reference, toolkit proof-refresh
receipts, the non-publish release-candidate bundle closeout, and the Adze
Adoption Hardening closeout are merged. Post-closeout audit, CI routing, and
verifier hygiene are also merged, including standby audit refreshes, job-scoped
Rust Small Cargo homes, CPX42 route-label alignment, and issue-tracked active
goal blockers, plus the Windows check-msrv shell-path fix and the Windows
`just build` PDB collision fix. The CX53 Rust Small stale-queue follow-up
remains tracked as a blocked CI investigation, with route candidate
diagnostics, a temporary Rust Small route quarantine, label/group diagnostics,
and route-runner self-count exclusion. The legacy PR Gate
stale-queue follow-up is mitigated by PR-close cancellation, with PR body
guidance preserved for avoiding accidental issue auto-close. No new
non-release implementation lane is selected; EffortlessMetrics/adze-swarm#549
is resolved by explicitly keeping this paused standby state until a future
maintainer selects and records a fresh non-release lane.
Release, publish, signing, Cargo-token, public promotion, and
crates.io install-receipt work remain blocked on explicit human authorization
tracked by EffortlessMetrics/adze-swarm#325.
"""

handoff = """
For routine development, replace this paused standby manifest with a fresh
non-release lane in adze-swarm before opening implementation work. For release
or publish work, stop until human
authorization selects a public adze promotion/release path. Do not infer a new
public adze implementation lane from this paused manifest.
"""

end_state = [
  "adze-swarm remains the operating repo for development, proof, source-of-truth, CI, examples, docs-proof, runtime, tablegen, query, diagnostics, and performance work.",
  "public adze remains the release, public-intake, promotion, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "No release tag, crate publish, signing, Cargo-token, or crates.io install-receipt work is authorized by this standby state.",
  "Default adze-swarm PR proof remains self-hosted and normalized through Rust Small Result.",
  "No GitHub-hosted fallback is introduced without an explicit recorded exception.",
  "Heavy, advisory, coverage, benchmark, product-proof, and full-matrix lanes remain path-routed, labeled, scheduled, manually dispatched, or explicitly budgeted.",
  "AdzeDocument remains the canonical parse product; public views remain projections over that document.",
  "No cargo-install, Tree-sitter parity, query parity, incremental performance, GLR generality, or benchmark performance claim is broadened without a real receipt.",
]

