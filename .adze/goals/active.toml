id = "adze-swarm-forge-standby"
title = "Adze-swarm Forge Standby"
status = "paused"
owner = "repo-governance"
created = "2026-05-31"

pause_reason = """
The #643 upstream query differential proof spike completed through #645 and
the #646 closeout archived that lane. No non-release implementation work item
is currently active or ready. The current operating board is #617, release
authorization and crates.io install receipt work remain blocked on #325, and
CX53 runner readiness remains blocked on #598. This paused state does not
authorize public adze work, release, publish, signing, Cargo-token, hosted
fallback restoration, or crates.io install receipt work.
"""

objective = """
Keep adze-swarm in a clean research-board standby state while no bounded
implementation lane is selected. Preserve the split where adze-swarm is the
development, research, proof, CI, and release-candidate factory, while public
adze remains the release, public intake, promotion, tag, publish, signing,
Cargo-token, and crates.io receipt surface.
"""

handoff = """
Start from #617 before opening any new PR. If a future non-release task is
selected, create or refresh a bounded issue and source-of-truth lane before
implementation. If release, promotion, tag, publish, signing, Cargo-token, or
crates.io install work is requested, stop unless #325 explicitly authorizes the
public adze release path.
"""

end_state = [
  "adze-swarm remains the operating repo for development, proof, source-of-truth, CI, examples, docs-proof, runtime, tablegen, query, diagnostics, and performance work.",
  "public adze remains the release, public-intake, promotion, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "No release tag, crate publish, signing, Cargo-token, or crates.io install-receipt work is authorized by this standby state.",
  "Default adze-swarm Rust/product execution remains self-hosted and normalized through Rust Small Result.",
  "Hosted control-plane routing, path detection, source-of-truth policy checks, capacity diagnostics, and aggregate result reporting remain explicit exceptions; no GitHub-hosted Rust/product fallback is introduced without an explicit recorded exception.",
  "Heavy, advisory, coverage, benchmark, product-proof, and full-matrix lanes remain path-routed, labeled, scheduled, manually dispatched, or explicitly budgeted.",
  "AdzeDocument remains the canonical parse product; public views remain projections over that document.",
  "No cargo-install, Tree-sitter parity, query parity, incremental performance, GLR generality, or benchmark performance claim is broadened without a real receipt.",
]

