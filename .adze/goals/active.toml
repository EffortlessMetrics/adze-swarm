objective = """
Select the #661 no-panic policy burn-down as the next bounded non-release
adze-swarm implementation lane. The lane removes `write!` / `writeln!`
unwraps into an in-memory `String` from `tool/src/visualization.rs` only,
preserves visualization output behavior, and leaves release, public promotion,
support-tier promotion, CI routing, and crates.io install work outside scope.
"""

handoff = """
Start from #617 and #661. The selected implementation item
`visualization-string-write-unwraps` was merged in #678 and removed the
`tool/src/visualization.rs` String-write unwrap findings while preserving the
focused visualization proof surface. If release, promotion, tag, publish,
signing, Cargo-token, crates.io install, public adze implementation, policy
allowlist, checker-mode promotion, or CI routing work is requested, stop unless
the relevant source-of-truth issue explicitly selects that separate lane. No
non-release implementation item is active or ready; return to #617 for the next
decision packet before opening more implementation work.
"""

end_state = [
  "adze-swarm remains the operating repo for non-release implementation, proof, source-of-truth, CI, examples, docs-proof, runtime, tablegen, query, diagnostics, and performance work.",
