objective = """
Burn down the remaining product-trust gaps that surfaced after the public
promotion execution closeout. Keep work in adze-swarm, keep public adze as the
release/public-intake surface, and either prove or explicitly bound every
remaining product claim before public promotion.
"""

end_state = [
  "adze-swarm remains the operating repo for swarm implementation and product-proof work.",
  "public adze receives no new swarm work outside an explicit public promotion or release PR.",
  "Current release-facing docs no longer use unbacked production-ready wording for experimental or internal surfaces.",
  "External-scanner recovery coverage is either backed by focused proof commands or remains explicitly listed as future work.",
  "docs/status/PRODUCT_OBJECTIVE_AUDIT.md reflects the latest proof receipts and remaining non-completion reasons.",
  "No crates.io cargo-install claim is made until a real install receipt exists.",
  "ci-product-stable remains advisory unless branch-protection policy records a promotion.",
  "Public promotion remains blocked or proceeds only through the recorded release-promotion plan.",
]

