id = "adze-glr-toolkit-productization"
title = "Adze GLR Toolkit Productization"
status = "complete"
owner = "droid-factory"
created = "2026-05-17"

objective = """
Promote Adze from an implemented parser runtime into a well-tested GLR parser
toolkit with Tree-sitter-compatible selected-tree output, document-backed
projections, query compatibility, diagnostics, recovery, performance baselines,
and support-tier-backed product claims.
"""

end_state = [
  "New users have one obvious repo-proven first-use path: build the CLI from the checkout, run adze init, cargo test, and parse an example; published cargo install adze-cli remains release-surface proof.",
  "AdzeDocument remains the canonical parse product and every public view is documented as a projection.",
  "GLR conflict handling has generated conflict-matrix proof for the supported grammar classes.",
  "Selected-tree behavior is deterministic and Tree-sitter-compatible for the documented subset.",
  "Ambiguity summaries are native document facts and full forest exposure remains explicitly experimental.",
  "Query compatibility has a documented supported subset with source-aware predicate proof.",
  "Diagnostics and recovery have bad-input matrix proof across spans, UTF-8, EOF, missing nodes, and ambiguity.",
  "Performance baselines exist for parse, parse_document, projections, query, diagnostics, and table decode paths.",
  "Support tiers promote only slices backed by proof commands and known limitations.",
]

