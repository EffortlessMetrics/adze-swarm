id = "adze-parser-runtime-maintainability-hardening"
title = "Adze Parser Runtime Maintainability Hardening"
status = "complete"
owner = "runtime/product"
created = "2026-05-21"
archived = "2026-05-21"

objective = """
Keep the proven parser and runtime product surfaces maintainable after the
release-boundary closeout. Use small, proof-backed adze-swarm PRs to audit and
harden supported parser, runtime, tablegen, diagnostics, query, and projection
surfaces without changing release authorization, public publish state, or
support-tier claims by implication.
"""

end_state = [
  "adze-swarm remains the operating repo for implementation, proof, and maintainability work.",
  "public adze remains the release, public-intake, promotion, tag, publish, signing, and Cargo-token surface.",
  "No release tag, crate publish, signing, Cargo-token, or crates.io install-receipt work happens in this lane.",
  "Parser/runtime/tablegen maintainability work is organized into PR-sized items with focused proof commands.",
  "Stable README and support-tier claims are not promoted without proof receipts and source-of-truth updates.",
  "The supported product proof loop remains green or failures are recorded as explicit friction before follow-up work proceeds.",
  "Any future public release candidate still requires an explicit promotion/sync from adze-swarm to public adze before publish.",
]

