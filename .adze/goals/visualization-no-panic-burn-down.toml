id = "visualization-no-panic-burn-down"
title = "Visualization No-Panic Burn-Down"
status = "paused"
owner = "tooling/policy"
created = "2026-06-05"

objective = """
Select the #661 no-panic policy burn-down as the next bounded non-release
adze-swarm implementation lane. The lane removes `write!` / `writeln!`
unwraps into an in-memory `String` from `tool/src/visualization.rs` only,
preserves visualization output behavior, and leaves release, public promotion,
support-tier promotion, CI routing, and crates.io install work outside scope.
"""

handoff = """
This is a non-release adze-swarm lane selected from the research board in
EffortlessMetrics/adze-swarm#617 and the bounded implementation issue
EffortlessMetrics/adze-swarm#661. It does not authorize public adze
implementation, release, publish, signing, Cargo-token, crates.io install
receipt work, CI routing changes, no-panic allowlist edits, checker-mode
promotion, or support-tier promotion.
"""

end_state = [
  "adze-swarm remains the operating repo for non-release implementation and proof work.",
  "public adze remains release, public intake, promotion, tag, publish, signing, Cargo-token, and crates.io receipt surface.",
  "#661 was selected by the research board and merged by #678.",
  "The merged implementation diff was limited to tool/src/visualization.rs.",
  "Visualization DOT, SVG, text summary, and dependency output behavior stayed covered by focused tests.",
  "No policy allowlist entry, checker-mode promotion, support-tier promotion, release action, public adze work, or crates.io install claim is made.",
  "Release, publish, signing, Cargo-token, public promotion, and crates.io install-receipt work remain blocked on #325.",
]

