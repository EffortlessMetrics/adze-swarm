id = "adze-user-experience-hardening"
title = "Adze User Experience Hardening"
status = "active"
owner = "droid-factory"
created = "2026-05-20"

objective = """
Make Adze easier to adopt without changing release claims: improve starter
project polish, examples, docs navigation, local developer ergonomics,
diagnostics/query/Tree-sitter walkthroughs, and performance receipt guidance
while keeping support-tier boundaries intact.
"""

end_state = [
  "adze-swarm remains the operating repo for non-release development and proof work.",
  "public adze remains release/public-intake/publish surface unless explicitly promoted.",
  "release/publish/signing/Cargo-token work remains blocked on issue #325 until explicitly authorized.",
  "starter and downstream examples are easier to use and remain proof-backed.",
  "API navigation keeps grammar::parse as the beginner path and parse_document as the tooling path.",
  "diagnostics, query, and Tree-sitter walkthroughs name supported subsets and known gaps.",
  "performance docs distinguish receipts from public speed claims.",
  "local proof-loop friction is reduced or explicitly recorded when it blocks routine development.",
]

