[package]
name = "adze-ir"
version = "0.9.0"
edition = "2024"
rust-version = "1.95.0"
description = "Grammar Intermediate Representation for pure-Rust Tree-sitter"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/effortlessmetrics/adze"
homepage = "https://github.com/effortlessmetrics/adze"
documentation = "https://docs.rs/adze-ir"
readme = "README.md"
publish = true
include = ["Cargo.toml", "LICENSE*", "README*", "src/**"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
optimize = []
strict_docs = []

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
adze-glr-core = { version = "0.9.0", path = "../glr-core" }
indexmap = { workspace = true, features = ["serde"] }
