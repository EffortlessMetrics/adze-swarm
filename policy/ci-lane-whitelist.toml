# CI lane whitelist for adze.
#
# Every workflow job that runs on PR or push must have a lane entry here.
# Each lane carries its purpose, owner, cost, evidence artifact, duplicate
# map, and review/expiry dates. See docs/ci/cost-and-verification-policy.md.
#
# Field semantics:
#   `job`  : YAML job id as it appears in the workflow file (e.g. `supported`).
#            Use `"multiple"` to whitelist every job in a workflow without
#            enumerating each one.
#   `id`   : stable lane id used by risk packs and exceptions. Decoupled
#            from `job` so we can rename workflow jobs without churn.
#
# This file is advisory until `cargo xtask check-ci-lane-whitelist` is run
# in blocking mode in CI; until then the whitelist lint reports findings to
# `target/policy/ci-lane-whitelist.json` without failing the build.

schema_version = "1.0"
policy = "ci-lane-whitelist"
owner = "release/ci"
status = "advisory"
updated = "2026-05-15"

[budget]
# All values in LEM (Linux-equivalent minutes).
preferred_default_lem = 25
default_limit_lem = 35
elevated_limit_lem = 75
hard_limit_lem = 125

[runner_multipliers]
ubuntu_latest = 1.0
ubuntu_22_04 = 1.0
ubuntu_24_04 = 1.0
windows_latest = 2.0
macos_latest = 10.0
docker_build = 6.0
external_ai_review = 4.0

# ---------------------------------------------------------------------------
# Tier 0/1 — frontdoor lanes
# ---------------------------------------------------------------------------

[[lane]]
id = "pr-plan"
workflow = ".github/workflows/pr-plan.yml"
job = "plan"
display_name = "PR Plan"
kind = "control"
tier = "frontdoor"
default_pr = true
blocking = false
runner = "ubuntu_latest"
base_lem = 1
owner = "release/ci"
intent = "Forecast CI lanes and Linux-equivalent minutes for this PR."
failure_mode = "CI spend and selected verification lanes are invisible."
proof_obligation = "Compute changed areas, selected lanes, budget band, and emit ci-plan.json."
evidence = ["target/ci/ci-plan.json", "GitHub step summary"]
allowed_triggers = ["pull_request", "workflow_dispatch"]
duplicate_of = []
review_after = "2026-06-07"
expires = "2026-11-07"

