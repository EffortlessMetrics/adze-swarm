schema_version = "1.0"

# Allowlist for non-Rust files that legitimately live in this repository.
# Rust + xtask is the default implementation surface. Every other language or
# config surface must be registered here with owner, surface, classification,
# and a `covered_by` list (the checks/tools that exercise it).
#
# Required fields per entry:
#   * `glob`           — globset pattern, repo-relative
#   * `kind`           — categorical identifier (see below)
#   * `owner`          — team or code area
#   * `surface`        — ci | docs | fixtures | editor | grammar | release | …
#   * `classification` — config | docs | fixtures | test | tooling | generated | production
#   * `reason`         — why a non-Rust artifact is required here
#   * `covered_by`     — list of commands or workflows that exercise it
#
# Optional:
#   * `expires`     — ISO date; entry must be revisited
#   * `retired`     — true if the entry exists only for migration audit
#   * `generated_by` — for `classification = "generated"` entries

# CI / GitHub configuration
[[allow]]
glob = ".github/**/*.yml"
kind = "ci_declarative"
owner = "release/ci"
surface = "ci"
classification = "config"
reason = "GitHub Actions workflow definitions are platform-required YAML."
covered_by = ["just ci-supported"]

[[allow]]
glob = ".github/**/*.md"
kind = "ci_docs"
owner = "release/ci"
surface = "ci"
classification = "docs"
reason = "Issue/PR templates and CODEOWNERS-adjacent docs."
covered_by = ["manual review"]

