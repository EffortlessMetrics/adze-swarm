schema_version = "1.0"
msrv = "1.95"

# This file is the source of truth for the workspace lint policy.
# It is *documentation + manifest*. Actual enforcement happens through:
#   * `[workspace.lints]` in the root Cargo.toml (catches local code shapes)
#   * `cargo xtask check-no-panic-family` (semantic exception ledger)
#   * `cargo xtask check-file-policy` (non-Rust surface ledger)
#   * `cargo xtask check-lint-policy` (verifies inheritance and consistency)
#
# The two rails are intentional:
#   - Clippy gives fast IDE/CI feedback on code shapes.
#   - The semantic checker owns owner/reason/expiry/selector identity for exceptions.

[policy]
panic_free_tests = true
allow_test_carveouts = false
suppression_style = "expect-with-reason"
blanket_categories = false

# Active workspace lints (mirror what `[workspace.lints]` enforces today).
[active.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"
unused_extern_crates = "deny"
unexpected_cfgs = "warn"
const_item_interior_mutations = "deny"

[active.clippy]
allow_attributes_without_reason = "deny"
decimal_bitwise_operands = "warn"
disallowed_fields = "deny"
manual_checked_ops = "warn"
manual_ilog2 = "warn"
needless_type_cast = "warn"
same_length_and_capacity = "deny"

# Staged lints — currently advisory in the semantic checker. Plan:
#   stage 1 (now): warn here, semantic checker is advisory
#   stage 2:        clear the warn-stage debt or receipt it in the allowlist
#   stage 3:        promote to deny in `[workspace.lints]`
[staged.clippy]
unwrap_used = { level = "warn", target = "deny", stage = 1 }
expect_used = { level = "warn", target = "deny", stage = 1 }
panic = { level = "warn", target = "deny", stage = 1 }
todo = { level = "warn", target = "deny", stage = 1 }
unimplemented = { level = "warn", target = "deny", stage = 1 }
unreachable = { level = "warn", target = "deny", stage = 1 }
get_unwrap = { level = "warn", target = "deny", stage = 1 }
unwrap_in_result = { level = "warn", target = "deny", stage = 1 }
indexing_slicing = { level = "warn", target = "deny", stage = 1 }
string_slice = { level = "warn", target = "deny", stage = 1 }
dbg_macro = { level = "warn", target = "deny", stage = 1 }

# Rustc lints (not clippy) that have a staged warn -> deny promotion path.
# missing_docs is currently warn in [workspace.lints.rust] (Cargo.toml:58)
# but per-crate `#![cfg_attr(not(feature = "strict_docs"), allow(missing_docs))]`
# suppresses it in 5 of 7 core crates. This staged entry records the intent
# to promote to deny once the per-crate debt is cleared.
[staged.rust]
missing_docs = { level = "warn", target = "deny", stage = 2 }

# Planned lints — gated on future MSRV bumps. The Rust 1.94/1.95 lint batch is
# active as of the 0.9 Clippy policy refresh.
