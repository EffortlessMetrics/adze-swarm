schema_version = "0.3"

# Semantic allowlist for panic-family debt.
#
# Identity = full key (path, family, kind, container, callee,
# receiver_fingerprint). Line/column drift does not invalidate an entry;
# every other field does. A receipt for one call shape never authorizes a
# second distinct call.
#
# Mode contract (enforced by `cargo xtask check-no-panic-family --mode ..`):
#   advisory          — report everything, fail only on unreadable/unparseable
#                       files or an empty production denominator.
#   blocking-allowlist— fail on unallowlisted findings; stale/expired entries
#                       are REPORTED ONLY, not enforced.
#   blocking-strict   — fail on unallowlisted, stale, or expired entries.
# Scan-integrity failures (failed files, empty denominator) fail every mode.
#
# Every entry must specify:
#   * `id`             — stable identifier (`panic-NNNN`)
#   * `path`           — repo-relative source path
#   * `family`         — one of: unwrap | expect | panic_macro | todo |
#                        unimplemented | unreachable | indexing | string_slice |
#                        get_unwrap | unwrap_in_result
#   * `classification` — one of: test_helper | fixture_setup | invariant |
#                        external_contract | legacy | placeholder | governance
#   * `owner`          — code area / team responsible for cleanup
#   * `explanation`    — why this exception exists and what would replace it
#   * `expires`        — ISO date; blocking-strict fails on expired entries
#
# The selector identifies the *call shape* and survives line/column drift.
#   selector.kind = "method_call" | "qualified_call" | "macro_call" |
#                   "index_expr" | "slice_expr"
#   selector.container = enclosing fn / impl / mod path
#   selector.callee = method or macro name ("[]" for index/slice)
#   selector.receiver_fingerprint = textual receiver fingerprint for method
#                   calls (load-bearing: None never matches Some(..)).
#
# Known false-positive class (classify, do not suppress): `[]` on
# `serde_json::Value` never panics (missing key yields Null); the scanner
# has no type info and still reports it as `indexing`.
#
# Add new exceptions only via `cargo xtask no-panic-propose` and review.

# Only individually reviewed exceptions are adopted here; a generated baseline
# does not authorize the remaining workspace findings.

# Generated by `cargo xtask no-panic-propose` and reviewed on 2026-11-02
# for PR #1184. This records the existing legacy C build-script failure
# boundary; it does not make the advisory checker a blocking gate.
[[allow]]
id = "panic-3452"
path = "tool/src/build_parsers/mod.rs"
family = "panic_macro"
classification = "legacy"
owner = "tool/build_parsers (#867)"
explanation = "The existing unit-returning legacy C build helper terminates a failed grammar build. Preserve the source-path/cause diagnostic verified by the actual Cargo build-script regression; replace this boundary with a reviewed fallible builder interface under #867. No pure-Rust or dependency panic is covered."
expires = "2026-12-02"

[allow.selector]
kind = "macro_call"
container = "build_parsers"
callee = "panic"

[allow.last_seen]
line = 44
column = 9

