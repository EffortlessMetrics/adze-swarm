[package]
name = "adze-bdd-governance-core"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Core BDD governance matrix primitives composed with parser feature policies."
repository = "https://github.com/EffortlessMetrics/adze"
publish = ["crates.io"]
keywords = ["bdd", "testing", "scenarios", "parser", "grammar"]
categories = ["development-tools::testing"]
homepage = "https://github.com/EffortlessMetrics/adze"
documentation = "https://docs.rs/adze-bdd-governance-core"

[features]
default = []
pure-rust = []
tree-sitter-c2rust = []
tree-sitter-standard = []
glr = ["pure-rust"]
strict_api = []
strict_docs = []

[dev-dependencies]
criterion.workspace = true
proptest = { workspace = true }

[[bench]]
name = "bdd_grid_bench"
harness = false
