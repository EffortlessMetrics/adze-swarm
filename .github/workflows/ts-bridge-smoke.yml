name: ts-bridge-smoke

on:
  push:
    branches: [main]
    paths:
      - tools/ts-bridge/**
      - scripts/smoke-link.sh
      - .github/workflows/ts-bridge-smoke.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - tools/ts-bridge/**
      - scripts/smoke-link.sh
      - .github/workflows/ts-bridge-smoke.yml
  workflow_dispatch:
    inputs:
      matrix:
        description: "Runner matrix to use"
        type: choice
        default: linux
        options:
          - linux
          - full-os

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    name: ts-bridge matrix setup
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'full-ci' ||
      github.event.label.name == 'platform-matrix'
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      os: ${{ steps.compute.outputs.os }}
    steps:
      - id: compute
        run: |
          set -euo pipefail
          full=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.matrix }}" = "full-os" ]; then
            full=true
          elif [ "${{ github.event_name }}" = "pull_request" ] && \
            { [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" = "true" ] || \
              [ "${{ contains(github.event.pull_request.labels.*.name, 'platform-matrix') }}" = "true" ]; }; then
            full=true
          fi

          if [ "$full" = "true" ]; then
            echo 'os=["self-hosted-linux"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["self-hosted-linux"]' >> "$GITHUB_OUTPUT"
          fi
          echo "full_os=$full"

  smoke:
    needs: matrix-setup
    strategy:
      matrix:
        os: ${{ fromJson(needs.matrix-setup.outputs.os) }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      - name: Verify self-hosted Tree-sitter tools
        run: |
          set -euo pipefail
          command -v pkg-config
          pkg-config --exists tree-sitter

      - name: Run ts-bridge smoke test
        shell: bash
        run: bash scripts/smoke-link.sh ts-bridge
