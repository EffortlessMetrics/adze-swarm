name: EM CI Routed Rust

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: em-ci-routed-rust-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route-rust-small:
    name: Route Rust Small
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, trusted-pr]
    timeout-minutes: 5

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    outputs:
      target: ${{ steps.route.outputs.target }}
      target_reason: ${{ steps.route.outputs.target_reason }}
      fallback_allowed: ${{ steps.route.outputs.fallback_allowed }}

    steps:
      - name: Choose target
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          ORG: EffortlessMetrics
        run: |
          set -uo pipefail

          if [ -z "${GITHUB_OUTPUT:-}" ]; then
            echo "GITHUB_OUTPUT is not set"
            exit 1
          fi
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"

          fallback_github() {
            reason="$1"
            echo "router_target=github"
            echo "router_error=true"
            echo "router_reason=${reason}"
            echo "target=github" >> "$GITHUB_OUTPUT"
            echo "target_reason=${reason}" >> "$GITHUB_OUTPUT"
            echo "fallback_allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          for tool in curl python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "required self-hosted routing tool is missing: $tool"
              fallback_github "runner_tool_missing_${tool}"
            fi
          done

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "EM_RUNNER_READ_TOKEN is not set"
            fallback_github "runner_token_missing"
          fi

          runner_json="$(mktemp)"
          current_runner="${RUNNER_NAME:-}"
          echo "route job runner: ${current_runner:-unknown}"
          trap 'rm -f "$runner_json"' EXIT

          set +e
          runners="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:-https://api.github.com}/orgs/${ORG}/actions/runners?per_page=100" 2>&1)"
          api_exit=$?
          set -e

          if [ "$api_exit" -ne 0 ]; then
            echo "runner API request failed (exit=${api_exit}): ${runners}"
            fallback_github "runner_api_failed"
          fi
          printf '%s' "$runners" > "$runner_json"

          count_idle() {
            local runner_class="$1"
            local rust_label="$2"
            local extra_label="${3:-}"
            python3 - "$runner_json" "$runner_class" "$rust_label" "$extra_label" "$current_runner" <<'PY' 2>&1
          import json
          import sys

          path, runner_class, rust_label, extra_label, current_runner = sys.argv[1:6]
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)

          required = {"em-ci", runner_class, rust_label, "trusted-pr"}
          if extra_label:
              required.add(extra_label)

          count = 0
          for runner in data.get("runners", []):
              if runner.get("status") != "online":
                  continue
              runner_name = str(runner.get("name", ""))
              labels = {
                  str(label.get("name", "")).lower()
                  for label in runner.get("labels", [])
              }
              if required <= labels and (
                  runner.get("busy") is False or runner_name == current_runner
              ):
                  count += 1

          print(count)
          PY
          }

          summarize_candidates() {
            local runner_class="$1"
            local rust_label="$2"
            local extra_label="${3:-}"
            if ! python3 - "$runner_json" "$runner_class" "$rust_label" "$extra_label" "$current_runner" <<'PY' 2>&1
          import json
          import sys

          path, runner_class, rust_label, extra_label, current_runner = sys.argv[1:6]
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)

          required = {"em-ci", runner_class, rust_label, "trusted-pr"}
          if extra_label:
              required.add(extra_label)

          rows = []
          for runner in data.get("runners", []):
              runner_name = str(runner.get("name", ""))
              labels = {
                  str(label.get("name", "")).lower()
                  for label in runner.get("labels", [])
              }
              if required <= labels:
                  status = str(runner.get("status", "unknown"))
                  busy = runner.get("busy")
                  current = ",current=true" if runner_name == current_runner else ""
                  rows.append(
                      f"{runner_name}:status={status},busy={busy}{current}"
                  )

          descriptor = f"{runner_class}/{rust_label}"
          if extra_label:
              descriptor = f"{descriptor}/{extra_label}"
          if rows:
              print(f"{descriptor} candidate runners: {'; '.join(sorted(rows))}")
          else:
              print(f"{descriptor} candidate runners: none")
          PY
            then
              echo "runner candidate summary failed for ${runner_class}/${rust_label}"
            fi
          }

          set +e
          cpx42="$(count_idle cpx42 rust-medium rust-16gb)"
          parse_exit=$?
          set -e
          if [ "$parse_exit" -ne 0 ] || ! printf '%s' "$cpx42" | grep -Eq '^[0-9]+$'; then
            echo "runner JSON parse failed for cpx42 (exit=${parse_exit}): ${cpx42}"
            fallback_github "parse_failed"
          fi

          set +e
          cx43="$(count_idle cx43 rust-small)"
          parse_exit=$?
          set -e
          if [ "$parse_exit" -ne 0 ] || ! printf '%s' "$cx43" | grep -Eq '^[0-9]+$'; then
            echo "runner JSON parse failed for cx43 (exit=${parse_exit}): ${cx43}"
            fallback_github "parse_failed"
          fi

          set +e
          cx33="$(count_idle cx33 rust-small)"
          parse_exit=$?
          set -e
          if [ "$parse_exit" -ne 0 ] || ! printf '%s' "$cx33" | grep -Eq '^[0-9]+$'; then
            echo "runner JSON parse failed for cx33 (exit=${parse_exit}): ${cx33}"
            fallback_github "parse_failed"
          fi

          set +e
          cx53="$(count_idle cx53 rust-small)"
          parse_exit=$?
          set -e
          if [ "$parse_exit" -ne 0 ] || ! printf '%s' "$cx53" | grep -Eq '^[0-9]+$'; then
            echo "runner JSON parse failed for cx53 (exit=${parse_exit}): ${cx53}"
            fallback_github "parse_failed"
          fi

          echo "cpx42 idle rust-medium rust-16gb runners: ${cpx42}"
          echo "cx43 idle rust-small runners: ${cx43}"
          echo "cx33 idle rust-small runners: ${cx33}"
          echo "cx53 idle rust-small runners (quarantined): ${cx53}"
          summarize_candidates cpx42 rust-medium rust-16gb
          summarize_candidates cx43 rust-small
          summarize_candidates cx33 rust-small
          summarize_candidates cx53 rust-small
          if [ "$cx53" -gt 0 ]; then
            echo "cx53 rust-small candidates are visible but not selected while adze-swarm#598 is blocked"
          fi

          if [ "$cpx42" -gt 0 ]; then
            echo "router_target=cpx42"
            echo "router_error=false"
            echo "router_reason=cpx42_idle"
            echo "target=cpx42" >> "$GITHUB_OUTPUT"
            echo "target_reason=cpx42_idle" >> "$GITHUB_OUTPUT"
            echo "fallback_allowed=false" >> "$GITHUB_OUTPUT"
          elif [ "$cx43" -gt 0 ]; then
            echo "router_target=cx43"
            echo "router_error=false"
            echo "router_reason=cx43_idle"
            echo "target=cx43" >> "$GITHUB_OUTPUT"
            echo "target_reason=cx43_idle" >> "$GITHUB_OUTPUT"
            echo "fallback_allowed=false" >> "$GITHUB_OUTPUT"
          elif [ "$cx33" -gt 0 ]; then
            echo "router_target=cx33"
            echo "router_error=false"
            echo "router_reason=cx33_idle"
            echo "target=cx33" >> "$GITHUB_OUTPUT"
            echo "target_reason=cx33_idle" >> "$GITHUB_OUTPUT"
            echo "fallback_allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "router_target=github"
            echo "router_error=false"
            echo "router_reason=no_idle_runner"
            echo "target=github" >> "$GITHUB_OUTPUT"
            echo "target_reason=no_idle_runner" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
              if LABELS_JSON="$labels" python3 - <<'PY'; then
          import json
          import os

          labels = json.loads(os.environ.get("LABELS_JSON", "[]") or "[]")
          raise SystemExit(0 if "allow-github-hosted" in {str(label).lower() for label in labels} else 1)
          PY
                echo "fallback_allowed=true" >> "$GITHUB_OUTPUT"
              else
                echo "fallback_allowed=false" >> "$GITHUB_OUTPUT"
              fi
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "fallback_allowed=true" >> "$GITHUB_OUTPUT"
            else
              echo "fallback_allowed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  rust-small-cpx42:
    name: Rust Small on CPX42
    needs: route-rust-small
    if: needs.route-rust-small.outputs.target == 'cpx42'

    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cpx42, rust-16gb, rust-medium, trusted-pr]

    timeout-minutes: 45

    env:
      CARGO_BUILD_JOBS: "7"
      # Keep Cargo registry/source downloads job-scoped. Shared Cargo homes can
      # be poisoned by mixed native/container ownership on self-hosted runners.
      CARGO_HOME: /mnt/ci-scratch/cargo-home/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_INCREMENTAL: "0"
      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: /mnt/ci-scratch/adze-swarm/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare CPX42 scratch
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 45
          ci-disk-guard /mnt/ci-cache 10
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Preflight disk and toolchain
        run: |
          set -euo pipefail
          df -h /mnt/ci-scratch /mnt/ci-cache || true
          rustc --version
          cargo --version
          if command -v python3 >/dev/null 2>&1; then python3 --version; fi
          if command -v sccache >/dev/null 2>&1; then sccache --show-stats || true; fi

      - name: Run Rust small gate
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo check --workspace --locked

      - name: Cleanup and final stats
        if: always()
        run: |
          set +e
          if command -v sccache >/dev/null 2>&1; then sccache --show-stats || true; fi
          rm -rf "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME"
          df -h /mnt/ci-scratch /mnt/ci-cache || true

  rust-small-cx43:
    name: Rust Small on CX43
    needs: route-rust-small
    if: needs.route-rust-small.outputs.target == 'cx43'

    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-small, trusted-pr]

    timeout-minutes: 45

    env:
      JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # Keep Cargo registry/source downloads job-scoped. Shared Cargo homes can
      # be poisoned by mixed native/container ownership on self-hosted runners.
      CARGO_HOME: /mnt/ci-scratch/cargo-home/${{ github.run_id }}-${{ github.run_attempt }}
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
      CARGO_INCREMENTAL: "0"

      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: /mnt/ci-scratch/target/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Guard disk
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 35
          ci-disk-guard /mnt/docker 5
          ci-disk-guard /mnt/ci-cache 5

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare scratch
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Run Rust small lane in container
        run: |
          set -euo pipefail

          docker run --rm \
            --label em.ci=true \
            --cpus="6" \
            --memory="12g" \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CARGO_HOME:/cargo-home" \
            -v "$SCCACHE_DIR:/sccache" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$TMPDIR:/tmp/jobtmp" \
            -w /workspace \
            -e PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e HOME=/workspace \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=20G \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_TARGET_DIR=/target \
            -e TMPDIR=/tmp/jobtmp \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=4 \
            -e RUST_TEST_THREADS=2 \
            -e RUST_BACKTRACE=1 \
            -e CARGO_TERM_COLOR=always \
            em-ci-rust:1.95 \
            -c 'set -euo pipefail
                rustc --version
                cargo --version
                just --version
                sccache --version

                if [ -f Cargo.toml ]; then
                  cargo fetch --locked
                  cargo check --workspace --locked
                  sccache --show-stats || true
                else
                  echo "No Cargo.toml found; infra smoke only."
                fi'

      - name: Cleanup scratch
        if: always()
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$TMPDIR:/tmpdir" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$CARGO_HOME:/cargo-home" \
            em-ci-rust:1.95 \
            -c 'find /tmpdir /target /cargo-home -mindepth 1 -delete 2>/dev/null || true' || true
          rmdir "${TMPDIR}" "${CARGO_TARGET_DIR}" "${CARGO_HOME}" 2>/dev/null || true
          df -h / /mnt/docker /mnt/actions /mnt/ci-scratch /mnt/ci-cache /mnt/ci-artifacts || true

  rust-small-cx33:
    name: Rust Small on CX33
    needs: route-rust-small
    if: needs.route-rust-small.outputs.target == 'cx33'

    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx33, rust-small, trusted-pr]

    timeout-minutes: 45

    env:
      JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # Keep Cargo registry/source downloads job-scoped. Shared Cargo homes can
      # be poisoned by mixed native/container ownership on self-hosted runners.
      CARGO_HOME: /mnt/ci-scratch/cargo-home/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"

      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: /mnt/ci-scratch/target/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Guard disk
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 25
          ci-disk-guard /mnt/docker 5
          ci-disk-guard /mnt/ci-cache 5

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare scratch
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Preflight disk and toolchain
        run: |
          set -euo pipefail
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true
          rustc --version
          cargo --version
          if command -v python3 >/dev/null 2>&1; then python3 --version; fi

      - name: Run Rust small gate
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo check --workspace --locked

      - name: Cleanup scratch
        if: always()
        run: |
          rm -rf "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME"
          df -h / /mnt/docker /mnt/actions /mnt/ci-scratch /mnt/ci-cache /mnt/ci-artifacts || true

  rust-small-cx53:
    name: Rust Small on CX53
    needs: route-rust-small
    if: needs.route-rust-small.outputs.target == 'cx53'

    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-small, trusted-pr]

    timeout-minutes: 45

    env:
      JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # Keep Cargo registry/source downloads job-scoped. Shared Cargo homes can
      # be poisoned by mixed native/container ownership on self-hosted runners.
      CARGO_HOME: /mnt/ci-scratch/cargo-home/${{ github.run_id }}-${{ github.run_attempt }}
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 60G
      RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "12"

      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: /mnt/ci-scratch/target/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Guard disk
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 100
          ci-disk-guard /mnt/docker 20
          ci-disk-guard /mnt/ci-cache 20

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare scratch
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Run Rust small lane in container
        run: |
          set -euo pipefail

          docker run --rm \
            --label em.ci=true \
            --cpus="14" \
            --memory="28g" \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CARGO_HOME:/cargo-home" \
            -v "$SCCACHE_DIR:/sccache" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$TMPDIR:/tmp/jobtmp" \
            -w /workspace \
            -e PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e HOME=/workspace \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=60G \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_TARGET_DIR=/target \
            -e TMPDIR=/tmp/jobtmp \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=12 \
            -e RUST_TEST_THREADS=2 \
            -e RUST_BACKTRACE=1 \
            -e CARGO_TERM_COLOR=always \
            em-ci-rust:1.95 \
            -c 'set -euo pipefail
                rustc --version
                cargo --version
                just --version
                sccache --version

                if [ -f Cargo.toml ]; then
                  cargo fetch --locked
                  cargo check --workspace --locked
                  sccache --show-stats || true
                else
                  echo "No Cargo.toml found; infra smoke only."
                fi'

      - name: Cleanup scratch
        if: always()
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$TMPDIR:/tmpdir" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$CARGO_HOME:/cargo-home" \
            em-ci-rust:1.95 \
            -c 'find /tmpdir /target /cargo-home -mindepth 1 -delete 2>/dev/null || true' || true
          rmdir "${TMPDIR}" "${CARGO_TARGET_DIR}" "${CARGO_HOME}" 2>/dev/null || true
          df -h / /mnt/docker /mnt/actions /mnt/ci-scratch /mnt/ci-cache /mnt/ci-artifacts || true

  rust-small-github:
    name: Rust Small on GitHub Hosted
    needs: route-rust-small
    if: needs.route-rust-small.outputs.target == 'github' && needs.route-rust-small.outputs.fallback_allowed == 'true'

    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Rust small lane
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          if [ -f Cargo.toml ]; then
            cargo fetch --locked
            cargo check --workspace --locked
          else
            echo "No Cargo.toml found; infra smoke only."
          fi

  runner-capacity-exhausted:
    name: Runner Capacity / Fallback Policy
    needs: route-rust-small
    if: needs.route-rust-small.outputs.target == 'github' && needs.route-rust-small.outputs.fallback_allowed != 'true'
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, trusted-pr]
    steps:
      - name: Fail with explicit routing policy message
        run: |
          echo "Self-hosted routing failed or no idle runner was available."
          echo "target_reason=${{ needs.route-rust-small.outputs.target_reason }}"
          echo "GitHub-hosted fallback is blocked by default in this workflow."
          echo "To allow tiny GitHub-hosted fallback on PR, add label: allow-github-hosted"
          echo "For trusted runs, wait for self-hosted capacity or use workflow_dispatch."
          exit 1

  rust-small-result:
    name: Rust Small Result
    needs:
      - route-rust-small
      - rust-small-cpx42
      - rust-small-cx43
      - rust-small-cx33
      - rust-small-cx53
      - rust-small-github
      - runner-capacity-exhausted
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'merge_group' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, trusted-pr]

    steps:
      - name: Check selected lane
        run: |
          set -euo pipefail

          target="${{ needs.route-rust-small.outputs.target }}"
          cpx42="${{ needs.rust-small-cpx42.result }}"
          cx43="${{ needs.rust-small-cx43.result }}"
          cx33="${{ needs.rust-small-cx33.result }}"
          cx53="${{ needs.rust-small-cx53.result }}"
          gh="${{ needs.rust-small-github.result }}"
          capacity="${{ needs.runner-capacity-exhausted.result }}"

          echo "target=${target}"
          echo "cpx42=${cpx42}"
          echo "cx43=${cx43}"
          echo "cx33=${cx33}"
          echo "cx53=${cx53}"
          echo "github=${gh}"
          echo "capacity=${capacity}"

          case "$target" in
            cpx42)
              test "$cpx42" = "success"
              ;;
            cx43)
              test "$cx43" = "success"
              ;;
            cx33)
              test "$cx33" = "success"
              ;;
            cx53)
              test "$cx53" = "success"
              ;;
            github)
              if [ "${{ needs.route-rust-small.outputs.fallback_allowed }}" = "true" ]; then
                test "$gh" = "success"
              else
                test "$capacity" = "failure"
              fi
              ;;
            *)
              echo "unknown target: $target"
              exit 1
              ;;
          esac
