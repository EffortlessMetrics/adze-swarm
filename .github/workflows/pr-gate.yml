name: PR Gate

# Optional planning, docs-only formatting, and per-run cost telemetry (#1027).
# Rust Small Result and Product Proof Result own integration qualification.
on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  plan:
    name: PR Plan
    uses: ./.github/workflows/pr-plan.yml

  docs-gate:
    name: Docs Gate
    needs: plan
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify formatting
        run: cargo fmt --all -- --check

  success:
    name: PR Planning Result
    needs: [plan, docs-gate]
    # Report failed/cancelled/missing prerequisites rather than skipping green.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Test planning result contract
        run: python3 scripts/test_pr_planning_gate.py
      - name: Aggregate gate result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DOCS_ONLY: ${{ needs.plan.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs-gate.result }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN_RESULT docs_only=$DOCS_ONLY docs=$DOCS_RESULT"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::PR Plan did not succeed"; exit 1
          fi
          case "$DOCS_ONLY" in
            true)
              if [ "$DOCS_RESULT" != "success" ]; then
                echo "::error::Selected docs formatting did not succeed"; exit 1
              fi
              echo "Planning and selected workspace formatting passed."
              ;;
            false)
              if [ "$DOCS_RESULT" != "skipped" ]; then
                echo "::error::Unselected Docs Gate has an inconsistent result"; exit 1
              fi
              echo "Planning passed; docs-only workspace formatting was not selected."
              ;;
            *)
              echo "::error::PR Plan docs_only output is missing or malformed"; exit 1
              ;;
          esac
          echo "Rust/product qualification is reported separately by Rust Small Result and Product Proof Result."
      - name: Append summary
        if: always()
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DOCS_ONLY: ${{ needs.plan.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs-gate.result }}
        run: |
          {
            echo "## PR Planning Result";
            echo "";
            echo "Optional planning and selected docs-only formatting; no Rust qualification claim.";
            echo "- plan: $PLAN_RESULT";
            echo "- docs-only: $DOCS_ONLY";
            echo "- docs-gate: $DOCS_RESULT";
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify reporting tools
        if: always()
        run: command -v python3
      - name: Download ci-plan artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: ci-plan
          path: target/ci/
      - name: Emit ci-actuals.json
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/emit-ci-actuals.py
      - name: Upload ci-actuals
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ci-actuals
          path: target/ci/ci-actuals.json
          if-no-files-found: warn
