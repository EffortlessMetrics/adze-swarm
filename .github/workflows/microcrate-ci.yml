name: Microcrate CI

# Crate-group test jobs and receipt jobs are routed by changed paths.
# workflow_dispatch and 'ci:microcrate' / 'full-ci' labels run everything.
# See docs/ci/adze-rollout-plan.md (PR 14).

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: microcrate-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2
  RAYON_NUM_THREADS: 4

jobs:
  changes:
    name: Detect Changed Crate Groups
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'full-ci' ||
      github.event.label.name == 'ci:microcrate'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_all: ${{ steps.detect.outputs.run_all }}
      concurrency: ${{ steps.detect.outputs.concurrency }}
      governance: ${{ steps.detect.outputs.governance }}
      bdd: ${{ steps.detect.outputs.bdd }}
      parser: ${{ steps.detect.outputs.parser }}
      core: ${{ steps.detect.outputs.core }}
      runtime: ${{ steps.detect.outputs.runtime }}
      fmt: ${{ steps.detect.outputs.fmt }}
      docs: ${{ steps.detect.outputs.docs }}
      wasm: ${{ steps.detect.outputs.wasm }}
      strict: ${{ steps.detect.outputs.strict }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - id: detect
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          run_all=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            run_all=true
          elif echo "$PR_LABELS_JSON" | grep -qE '"(full-ci|ci:microcrate)"'; then
            run_all=true
          fi
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)
            if echo "$changed" | grep -qE '^\.github/workflows/microcrate-ci\.yml$'; then
              run_all=true
            fi
          fi
          if [ "$run_all" = "true" ]; then
            for k in concurrency governance bdd parser core runtime fmt docs wasm strict; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          match() { echo "$changed" | grep -qE "$1"; }
          for k in concurrency governance bdd parser core runtime; do
            v=false
            case "$k" in
              concurrency) match '^runtime/src/concurrency_caps' && v=true ;;
              governance) match '^tests/governance/' && v=true ;;
              bdd) match '^(crates/bdd-governance-core/|glr-test-support/)' && v=true ;;
              parser) match '^(crates/parser-|crates/linecol-core|crates/parsetable-metadata|glr-core/|tablegen/)' && v=true ;;
              core) match '^(ir/|glr-core/|tablegen/|common/)' && v=true ;;
              runtime) match '^(runtime/|runtime2/|macro/|tool/|cli/)' && v=true ;;
            esac
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          fmt=false
          docs=false
          wasm=false
          strict=false
          fmt_paths='^(Cargo\.toml|rust-toolchain\.toml|\.rustfmt\.toml)$|^(runtime/|runtime2/|macro/|common/|ir/|glr-core/|tablegen/|crates/|grammars/|tool/|cli/|xtask/|tests/|testing/|glr-test-support/|test-mini/|lsp-generator/|playground/|wasm-demo/).*\.(rs|toml)$'
          docs_paths='^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$|^(runtime/|runtime2/|macro/|common/|ir/|glr-core/|tablegen/|crates/|grammars/|tool/|cli/|xtask/|tests/|testing/|glr-test-support/|test-mini/|lsp-generator/|playground/|wasm-demo/).*\.(rs|toml)$'
          strict_paths='^(Cargo\.toml|Cargo\.lock)$|^(common/|ir/|glr-core/|tablegen/|macro/|tool/|crates/bdd-governance-core/|crates/linecol-core/|crates/parsetable-metadata/).*\.(rs|toml)$'
          wasm_paths='^(Cargo\.toml|Cargo\.lock)$|^(runtime/|ir/|glr-core/|tablegen/).*\.(rs|toml)$'
          if match "$fmt_paths"; then
            fmt=true
          fi
          if match "$docs_paths"; then
            docs=true
          fi
          if match "$strict_paths"; then
            strict=true
          fi
          if match "$wasm_paths"; then
            wasm=true
          fi
          echo "fmt=$fmt" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "wasm=$wasm" >> "$GITHUB_OUTPUT"
          echo "strict=$strict" >> "$GITHUB_OUTPUT"
          echo "run_all=false" >> "$GITHUB_OUTPUT"

  # ── Formatting & doc checks (path-routed receipts) ──────────────────
  fmt-check:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  doc-check:
    name: Docs Build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build docs (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

  # ── WASM build check ────────────────────────────────────────────────
  wasm-check:
    name: WASM Build (core crates)
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Ensure wasm32 target is installed
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check adze-ir compiles for WASM
        run: cargo check --target wasm32-unknown-unknown -p adze-ir
      - name: Check adze-glr-core compiles for WASM
        run: cargo check --target wasm32-unknown-unknown -p adze-glr-core --no-default-features
      - name: Check adze-tablegen compiles for WASM
        run: cargo check --target wasm32-unknown-unknown -p adze-tablegen --no-default-features
      - name: Check adze (runtime) compiles for WASM
        run: cargo check --target wasm32-unknown-unknown -p adze --no-default-features

  # ── Feature matrix: strict_api / strict_docs ────────────────────────
  strict-features:
    name: Strict Features (${{ matrix.features }})
    needs: changes
    if: needs.changes.outputs.strict == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--features strict_api", "--features strict_docs"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check compilation (${{ matrix.features || 'default' }})
        run: |
          set -euxo pipefail
          # Crates that support both strict_api and strict_docs
          BOTH_CRATES=(
            adze-glr-core
            adze-tablegen
            adze-bdd-governance-core
            adze-linecol-core
            adze-parsetable-metadata
          )
          # Crates that only support strict_docs (not strict_api)
          DOCS_ONLY_CRATES=(
            adze-common
            adze-ir
            adze-macro
            adze-tool
          )

          FEATURE_FLAG="${{ matrix.features }}"

          for krate in "${BOTH_CRATES[@]}"; do
            echo "::group::Check $krate $FEATURE_FLAG"
            cargo check -p "$krate" $FEATURE_FLAG --locked 2>&1 || true
            echo "::endgroup::"
          done

          if [[ "$FEATURE_FLAG" == *"strict_api"* ]]; then
            echo "Skipping docs-only crates for strict_api (they lack this feature)"
          else
            for krate in "${DOCS_ONLY_CRATES[@]}"; do
              echo "::group::Check $krate $FEATURE_FLAG"
              cargo check -p "$krate" $FEATURE_FLAG --locked 2>&1 || true
              echo "::endgroup::"
            done
          fi
      - name: Test with strict features (${{ matrix.features || 'default' }})
        run: |
          set -euxo pipefail
          FEATURE_FLAG="${{ matrix.features }}"
          # Run tests for a representative subset to keep CI fast
          cargo test -p adze-glr-core $FEATURE_FLAG --lib -- --test-threads=$RUST_TEST_THREADS
          cargo test -p adze-tablegen $FEATURE_FLAG --lib -- --test-threads=$RUST_TEST_THREADS
          cargo test -p adze-linecol-core $FEATURE_FLAG --lib -- --test-threads=$RUST_TEST_THREADS || true

  # ── Crate-group parallel test jobs ──────────────────────────────────
  test-concurrency:
    name: Test Concurrency Crates
    needs: changes
    if: needs.changes.outputs.concurrency == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test concurrency crates
        run: |
          echo "No standalone concurrency microcrates remain; runtime owner modules are covered by ci-supported and runtime tests."

  test-governance:
    name: Test Governance Crates
    needs: changes
    if: needs.changes.outputs.governance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test governance crates
        run: |
          cargo test \
            -p governance-integration-tests \
            -- --test-threads=$RUST_TEST_THREADS

  test-bdd:
    name: Test BDD Crates
    needs: changes
    if: needs.changes.outputs.bdd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test BDD crates
        run: |
          cargo test \
            -p adze-bdd-governance-core \
            -p glr-test-support \
            -- --test-threads=$RUST_TEST_THREADS

  test-parser:
    name: Test Parser Crates
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test parser crates
        run: |
          cargo test \
            -p adze-linecol-core \
            -p adze-parsetable-metadata \
            -- --test-threads=$RUST_TEST_THREADS

  test-core:
    name: Test Core Crates (ir, glr-core, tablegen)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test adze-ir
        run: cargo test -p adze-ir -- --test-threads=$RUST_TEST_THREADS
      - name: Test adze-glr-core
        run: cargo test -p adze-glr-core --features test-api -- --test-threads=$RUST_TEST_THREADS
      - name: Test adze-tablegen
        run: cargo test -p adze-tablegen -- --test-threads=$RUST_TEST_THREADS
      - name: Test adze-common
        run: cargo test -p adze-common -- --test-threads=$RUST_TEST_THREADS

  test-runtime:
    name: Test Runtime Crates
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test adze (runtime)
        run: cargo test -p adze --lib --tests -- --test-threads=$RUST_TEST_THREADS
      - name: Test adze-runtime
        run: cargo test -p adze-runtime --lib --tests -- --test-threads=$RUST_TEST_THREADS
      - name: Test adze-macro
        run: cargo test -p adze-macro --features pure-rust -- --test-threads=$RUST_TEST_THREADS
      - name: Test adze-tool
        run: cargo test -p adze-tool -- --test-threads=$RUST_TEST_THREADS
