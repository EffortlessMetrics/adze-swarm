name: ripr advisory

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action == 'synchronize' || github.event.action == 'closed') }}

jobs:
  plan:
    name: PR Plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    uses: ./.github/workflows/pr-plan.yml

  ripr:
    name: ripr advisory
    needs: plan
    # Skip on docs-only PRs and on workflow_dispatch with no diff context.
    if: |
      always() &&
      !(github.event_name == 'pull_request' && github.event.action == 'closed') &&
      needs.plan.result != 'cancelled' &&
      (needs.plan.result == 'skipped' || needs.plan.outputs.docs_only != 'true')
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Resolve base/head SHAs
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install ripr (advisory, graceful on failure)
        id: ripr-install
        # ripr requires Rust 1.93+. Install through the workspace MSRV toolchain
        # and keep the advisory install on a graceful path.
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if rustup toolchain install "$TOOLCHAIN" --no-self-update --profile minimal --quiet \
            && cargo +"$TOOLCHAIN" install --locked ripr 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ripr --version || true
          else
            # ripr may not yet be published to crates.io; keep graceful fallback.
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ripr or workspace toolchain install unavailable; using stub report."
          fi
      - name: RIPR PR evidence
        if: steps.ripr-install.outputs.available == 'true'
        env:
          RIPR_BASE: ${{ steps.shas.outputs.base }}
          RIPR_HEAD: ${{ steps.shas.outputs.head }}
        run: cargo xtask ripr-pr
      - name: RIPR review guidance
        if: steps.ripr-install.outputs.available == 'true'
        env:
          RIPR_BASE: ${{ steps.shas.outputs.base }}
          RIPR_HEAD: ${{ steps.shas.outputs.head }}
        run: cargo xtask ripr-review-comments
      - name: Stub report (ripr not available)
        if: steps.ripr-install.outputs.available != 'true'
        run: |
          set -euo pipefail
          mkdir -p target/ripr/pr target/ripr/review
          cat > target/ripr/pr/repo-exposure.json <<'JSON'
          {
            "schema_version": 1,
            "status": "skipped",
            "reason": "ripr binary not available via cargo install; will activate when published to crates.io."
          }
          JSON
          cat > target/ripr/pr/repo-exposure.md <<'MD'
          # RIPR PR evidence

          ripr was not available; stub evidence was produced.
          MD
          cat > target/ripr/review/comments.json <<'JSON'
          {
            "schema_version": 1,
            "comments": [],
            "summary_only": [],
            "suppressed": [],
            "warnings": ["ripr binary not available via cargo install; stub guidance was produced."]
          }
          JSON
          cat > target/ripr/review/comments.md <<'MD'
          # RIPR review guidance

          ripr was not available; stub guidance was produced.
          MD
      - name: RIPR PR contract
        if: always()
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null 2>&1; then
            cargo xtask ripr-pr --check
            cargo xtask ripr-review-comments --check
          else
            echo "::notice::cargo unavailable on this self-hosted runner; checking stub RIPR artifacts directly."
            test -s target/ripr/pr/repo-exposure.json
            test -s target/ripr/pr/repo-exposure.md
            test -s target/ripr/review/comments.json
            test -s target/ripr/review/comments.md
          fi
      - name: RIPR annotations
        if: always()
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/ripr-annotations.py
          elif command -v python >/dev/null 2>&1; then
            python scripts/ripr-annotations.py
          else
            echo "::notice::python unavailable on this self-hosted runner; skipping advisory RIPR annotations."
          fi
      - name: Upload RIPR PR evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn
      - name: Upload RIPR review guidance
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn
      - name: Append summary
        if: always()
        run: |
          {
            echo "## ripr advisory";
            echo "";
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            elif [ "${{ steps.ripr-install.outputs.available }}" = "true" ]; then
              echo "- ripr installed via the workspace MSRV toolchain; analysis ran on \`${{ steps.shas.outputs.base }}..${{ steps.shas.outputs.head }}\`."
            else
              echo "- ripr install attempted with the workspace MSRV toolchain, but was not available yet; stub report uploaded."
            fi
            echo ""
            echo "### Artifacts"
            echo '- `ripr-pr`: `target/ripr/pr/`'
            echo '- `ripr-review`: `target/ripr/review/`'
          } >> "$GITHUB_STEP_SUMMARY"
