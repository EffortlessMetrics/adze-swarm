name: Product Proof

on:
  merge_group:
  # Ready (non-draft) PRs run path detection plus the canary dry-run
  # only: cheap real signal so the entry stays queueable. Stable
  # canaries run once per merge-queue entry. Drafts run nothing.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      lane:
        description: Product proof lane to run
        required: true
        default: stable
        type: choice
        options:
          - stable
          - all
  schedule:
    - cron: '20 4 * * 1' # weekly Monday advisory canary

permissions:
  contents: read

env:
  # Include the recorded shared-pipeline and workspace-input dependencies
  # from #1027, not only the top-level runtime/compiler claim surfaces.
  STABLE_PRODUCT_PATHS: |
    Cargo.toml
    Cargo.lock
    rust-toolchain.toml
    .cargo/**
    common/**
    crates/common-type-ops-core/**
    crates/linecol-core/**
    crates/parsetable-metadata/**
    README.md
    FAQ.md
    QUICK_START.md
    cli/README.md
    book/src/getting-started/quickstart.md
    book/src/getting-started.md
    book/src/getting-started/installation.md
    book/src/getting-started/migration.md
    book/src/appendix/faq.md
    book/src/advanced/optimizer-usage.md
    book/src/guide/dynamic-loading.md
    book/src/guide/troubleshooting.md
    book/src/guide/migration.md
    book/src/reference/cli-reference.md
    book/book/**
    docs/how-to/use-playground.md
    docs/how-to/optimize-performance.md
    cli/tests/readme_quickstart.rs
    cli/Cargo.toml
    cli/tests/cli_test.rs
    cli/tests/runner_output_contract.rs
    cli/tests/runner_process_contract.rs
    cli/tests/runner_linux_signal_contract.rs
    cli/tests/runner_protocol_contract.rs
    cli/tests/runner_windows_process_contract.rs
    cli/tests/runner_windows_output_contract.rs
    cli/tests/runner_windows_protocol_contract.rs
    cli/tests/fixtures/windows_runner_fixture.rs
    cli/tests/support/windows_fixture.rs
    cli/tests/support/windows_output.rs
    docs/product/ACCEPTANCE_MATRIX.md
    docs/README.md
    docs/reference/diagnostics-and-recovery.md
    docs/explanations/arena-allocator.md
    docs/explanations/direct-forest-splicing.md
    docs/explanations/glr-incremental-architecture.md
    docs/guides/ARENA_ALLOCATOR_GUIDE.md
    docs/reference/PUBLISH_CHECKLIST.md
    docs/tutorials/quickstart-10-minutes.md
    docs/tutorials/getting-started.md
    docs/tutorials/json-tutorial.md
    docs/status/SUPPORT_TIERS.md
    docs/status/NOW_NEXT_LATER.md
    docs/status/PRODUCT_OBJECTIVE_AUDIT.md
    docs/status/PRODUCT_PROOF_MAP.md
    docs/status/KNOWN_RED.md
    docs/specs/ADZE-SPEC-0011-product-proof-and-support-tiers.md
    docs/specs/ADZE-SPEC-0012-glr-toolkit-product-contract.md
    scripts/test_local_release_archive.py
    xtask/Cargo.toml
    xtask/src/main.rs
    xtask/src/policy.rs
    xtask/src/local_registry.rs
    xtask/src/local_registry_provenance.rs
    xtask/src/local_registry_provenance_tests.rs
    xtask/src/local_registry_lock_fixture.rs
    xtask/src/local_release_archive.py
    xtask/src/local_release_install.rs
    xtask/src/local_release_receipt.rs
    xtask/src/local_release_command.rs
    xtask/tests/local_release_command_contract.rs
    xtask/src/release_graph.rs
    policy/release-graph.toml
    policy/package-boundary.toml
    .github/workflows/local-release-receipt.yml
    samples/downstream-demo/**
    scripts/ci-product.sh
    scripts/ci-product-stable.sh
    scripts/lib/required-test-output.sh
    scripts/test_required_test_output.py
    scripts/run-required-test.py
    scripts/test_run_required_test.py
    scripts/check-linux-signal-regression.py
    scripts/test_linux_signal_regression.py
    scripts/fixtures/linux-signal/reviewed-source.json
    scripts/fixtures/linux-signal/legacy-load-red.patch
    scripts/evaluate-required-result.py
    scripts/test_evaluate_required_result.py
    .github/workflows/product-proof.yml
    runtime/**
    macro/**
    tool/**
    ir/**
    glr-core/**
    tablegen/**
    cli/src/**

concurrency:
  group: product-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-stable-product-paths:
    timeout-minutes: 5
    name: Detect Product Proof Paths
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      run_stable: ${{ steps.detect.outputs.run_stable }}
      reason: ${{ steps.detect.outputs.reason }}
      use_hosted: ${{ steps.detect.outputs.use_hosted }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Test required-result and product-path contracts
        run: python3 scripts/test_evaluate_required_result.py

      - id: detect
        name: Detect Stable product surfaces
        shell: bash
        # Event data is passed through env as data, never interpolated
        # into the shell script.
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Stable canaries always run on GitHub-hosted runners: the
          # em-ci-small runner group has no runners registered, and
          # expensive lanes no longer run on pull_request events.
          # Qualification happens once per merge-queue entry.
          echo "use_hosted=true" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "merge_group" && "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_stable=true" >> "$GITHUB_OUTPUT"
            echo "reason=event:${EVENT_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On merge_group, select from the actual integration difference
          # (base is the queue target, head is the integration commit G).
          # On pull_request, select from the PR difference. Unresolved
          # SHAs fail closed into running the stable canaries.
          base_sha="$MERGE_GROUP_BASE_SHA"
          head_sha="$MERGE_GROUP_HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          fi
          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "run_stable=true" >> "$GITHUB_OUTPUT"
            echo "reason=merge_group_sha_unresolved_fail_closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count both sides of a rename: moving a stable input outside
          # the allowlist still removes that input from the product.
          if ! changed_paths="$(git diff --no-renames --name-only "$base_sha" "$head_sha")"; then
            echo "::error::Product Proof merge_group diff failed."
            exit 1
          fi
          echo "Changed paths:"
          printf '%s\n' "$changed_paths"

          while IFS= read -r changed_path; do
            [[ -z "$changed_path" ]] && continue

            while IFS= read -r pattern; do
              [[ -z "$pattern" ]] && continue

              if [[ "$changed_path" == $pattern ]]; then
                echo "run_stable=true" >> "$GITHUB_OUTPUT"
                echo "reason=stable_surface:$changed_path" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done <<< "$STABLE_PRODUCT_PATHS"
          done <<< "$changed_paths"

          echo "run_stable=false" >> "$GITHUB_OUTPUT"
          echo "reason=no_stable_product_surface_changed" >> "$GITHUB_OUTPUT"

  pr-canary-plan:
    name: PR Canary Plan (dry-run)
    needs: detect-stable-product-paths
    # Cheap real product signal on ready PRs: the stable canary plan
    # must resolve. Drafts run nothing. Canaries execute in the queue.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
      - name: Show stable canary plan (dry-run)
        run: scripts/ci-product-stable.sh --dry-run

  ci-product-stable:
    timeout-minutes: 30
    name: ci-product stable canaries
    needs: detect-stable-product-paths
    if: needs.detect-stable-product-paths.outputs.run_stable == 'true' && github.event_name != 'pull_request'
    # Stable canaries run on GitHub-hosted runners; expensive lanes no
    # longer run on pull_request events.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Test required-proof output guards
        run: python3 scripts/test_required_test_output.py

      - name: Test Linux signal regression parser and wiring
        run: python3 scripts/test_linux_signal_regression.py

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Show stable canary plan (dry-run)
        run: scripts/ci-product-stable.sh --dry-run

      # Dependency preparation is online; the generated argv consumer keeps
      # its offline metadata and single locked build. This is no cold-cache claim.
      - name: Prepare locked native dependencies online for Linux consumers
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys

          lock = pathlib.Path("Cargo.lock")
          before = hashlib.sha256(lock.read_bytes()).hexdigest()
          print(f"dependency_preparation_lock_before_sha256={before}", flush=True)
          status = subprocess.run(
              ["cargo", "fetch", "--locked", "--target", "host-tuple"], check=False
          ).returncode
          print(f"dependency_preparation_fetch_status={status}", flush=True)
          try:
              after = hashlib.sha256(lock.read_bytes()).hexdigest()
          except OSError as error:
              print(f"Dependency preparation could not read Cargo.lock afterward: {error}", file=sys.stderr)
              raise SystemExit(status or 1)
          print(f"dependency_preparation_lock_after_sha256={after}", flush=True)
          if before != after:
              print("Dependency preparation changed Cargo.lock bytes.", file=sys.stderr)
              status = status or 1
          raise SystemExit(status)
          PY

      - name: Reproduce Linux signal legacy-load regression
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OWNED_ROOT: ${{ runner.temp }}/adze-linux-signal-regression-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/check-linux-signal-regression.py red --expected-sha "$EXPECTED_SHA" --owned-root "$OWNED_ROOT"

      # #1066 qualifies the Linux CLI boundary separately from the README
      # Stable claims. These checks do not promote CLI/platform support tiers.
      - name: Qualify Linux static runner process and output contracts
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/required-test-output.sh
          cargo clippy --locked -p adze-cli --bin adze --test runner_process_contract --test runner_output_contract --test runner_protocol_contract --test runner_linux_signal_contract -- -D warnings

          run_contract() {
            local label="$1" output status
            shift
            printf '\n[static runner] %s\n' "$label"
            if output="$("$@" 2>&1)"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if (( status != 0 )); then
              printf '%s failed with exit %s.\n' "$label" "$status" >&2
              return "$status"
            fi
            required_test_output "$output" "$label"
            case "$label" in
              'Linux process custody')
                printf '%s\n' "$output" | python3 scripts/check-linux-signal-regression.py green --suite process
                ;;
              'Linux signal finalization')
                printf '%s\n' "$output" | python3 scripts/check-linux-signal-regression.py green --suite signal
                ;;
            esac
          }

          run_contract 'Linux process custody' cargo test --locked -p adze-cli --test runner_process_contract -- --nocapture
          run_contract 'Linux signal finalization' cargo test --locked -p adze-cli --test runner_linux_signal_contract -- --nocapture --test-threads=1
          run_contract 'unchanged output interpretation' cargo test --locked -p adze-cli --test runner_output_contract -- --nocapture
          run_contract 'private runner framing' cargo test --locked -p adze-cli --test runner_protocol_contract -- --nocapture
          run_contract 'actual generated tree output' cargo test --locked -p adze-cli --test cli_test test_parse_static_tree_mode_emits_document_backed_tree -- --exact --nocapture
          run_contract 'actual generated document projections' cargo test --locked -p adze-cli --test cli_test test_parse_document_projection_modes_emit_schema_envelopes -- --exact --nocapture
          run_contract 'actual generated recovery diagnostics' cargo test --locked -p adze-cli --test cli_test parse_document_json_modes_emit_recovery_diagnostics -- --exact --nocapture
          run_contract 'actual generated child argv rejection' cargo test --locked -p adze-cli --bin adze generated_runner_argv_tests::test_generated_runner_protocol_args_precede_input_io -- --exact --nocapture

      # #1065 exercises small archive/metadata controls, not a full release install.
      - name: Qualify local release archive provenance controls
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/required-test-output.sh
          python3 scripts/test_local_release_archive.py
          cargo clippy --locked -p xtask --bin xtask --tests -- -D warnings

          run_release_contract() {
            local label="$1" output status
            shift
            printf '\n[local release] %s\n' "$label"
            if output="$("$@" 2>&1)"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if (( status != 0 )); then
              printf '%s failed with exit %s.\n' "$label" "$status" >&2
              return "$status"
            fi
            required_test_output "$output" "$label"
          }

          # Tiny Git/tar/Cargo controls only. The full selected release graph
          # and installed Linux/Windows journey remain separate candidate proof.
          run_release_contract 'source archive index and existing registry controls' cargo test --locked -p xtask --bin xtask local_registry:: -- --nocapture
          run_release_contract 'local release planning' cargo test --locked -p xtask --bin xtask local_release_install:: -- --nocapture
          run_release_contract 'local release receipt boundaries' cargo test --locked -p xtask --bin xtask local_release_receipt:: -- --nocapture
          run_release_contract 'Linux release command journal data' cargo test --locked -p xtask --test local_release_command_contract -- --nocapture

      - name: Run stable product lane
        run: scripts/ci-product-stable.sh

      - name: Retain Linux signal regression receipt
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: linux-signal-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adze-linux-signal-regression-${{ github.run_id }}-${{ github.run_attempt }}/receipt
          if-no-files-found: error

      - name: Retain Linux Cargo lock assumption artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: cargo-lock-assumption-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adze-lock-fixture-*
          include-hidden-files: true
          if-no-files-found: error

  ci-product-windows:
    timeout-minutes: 30
    name: ci-product Windows runner qualification
    needs: detect-stable-product-paths
    if: needs.detect-stable-product-paths.outputs.run_stable == 'true' && github.event_name != 'pull_request'
    # #1066 requires native Windows evidence for its CLI boundary. Reusing
    # the product selector does not promote Windows or CLI support tiers.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install pinned MSVC Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Verify checkout and record native Windows identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $actualSha = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualSha = $actualSha.Trim()
          if ($actualSha -cne $env:EXPECTED_SHA) {
            throw "Checkout $actualSha does not match required subject $env:EXPECTED_SHA"
          }
          Write-Output "checkout_sha=$actualSha"
          Write-Output "ImageOS=$env:ImageOS"
          Write-Output "ImageVersion=$env:ImageVersion"
          $windows = Get-CimInstance -ClassName Win32_OperatingSystem
          Write-Output "windows_version=$($windows.Version)"
          Write-Output "windows_build=$($windows.BuildNumber)"
          $rustIdentity = & rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustIdentity | Write-Output
          if ($rustIdentity -notcontains "host: x86_64-pc-windows-msvc") {
            throw "The compiler host is not x86_64-pc-windows-msvc"
          }
          if ($rustIdentity -notcontains "release: 1.95.0") {
            throw "The compiler release is not the pinned 1.95.0"
          }
          $lockHash = (Get-FileHash -LiteralPath Cargo.lock -Algorithm SHA256).Hash
          Write-Output "lock_sha256=$($lockHash.ToLowerInvariant())"

      - name: Check standalone native fixture formatting
        run: rustfmt --edition 2024 --check cli/tests/fixtures/windows_runner_fixture.rs

      - name: Test proof guard with actual native Rust harness
        run: python scripts/test_run_required_test.py

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Fetch the pinned native graph explicitly; earlier CLI builds and
      # unlocked generated canaries do not establish this offline prerequisite.
      - name: Prepare locked native dependencies online for Windows consumers
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import hashlib
          import pathlib
          import subprocess
          import sys

          lock = pathlib.Path("Cargo.lock")
          before = hashlib.sha256(lock.read_bytes()).hexdigest()
          print(f"dependency_preparation_lock_before_sha256={before}", flush=True)
          status = subprocess.run(
              ["cargo", "fetch", "--locked", "--target", "x86_64-pc-windows-msvc"], check=False
          ).returncode
          print(f"dependency_preparation_fetch_status={status}", flush=True)
          try:
              after = hashlib.sha256(lock.read_bytes()).hexdigest()
          except OSError as error:
              print(f"Dependency preparation could not read Cargo.lock afterward: {error}", file=sys.stderr)
              raise SystemExit(status or 1)
          print(f"dependency_preparation_lock_after_sha256={after}", flush=True)
          if before != after:
              print("Dependency preparation changed Cargo.lock bytes.", file=sys.stderr)
              status = status or 1
          raise SystemExit(status)
          '@ | python -
          exit $LASTEXITCODE

      - name: Strict Clippy for native Windows runner contracts
        run: cargo clippy --locked -p adze-cli --target x86_64-pc-windows-msvc --bin adze --test runner_windows_process_contract --test runner_windows_output_contract --test runner_windows_protocol_contract -- -D warnings

      - name: Qualify Windows process custody
        run: python scripts/run-required-test.py --label "Windows process custody" -- cargo test --locked -p adze-cli --target x86_64-pc-windows-msvc --test runner_windows_process_contract -- --nocapture

      - name: Qualify Windows output interpretation
        run: python scripts/run-required-test.py --label "Windows output interpretation" -- cargo test --locked -p adze-cli --target x86_64-pc-windows-msvc --test runner_windows_output_contract -- --nocapture

      - name: Qualify Windows private runner framing
        run: python scripts/run-required-test.py --label "Windows private runner framing" -- cargo test --locked -p adze-cli --target x86_64-pc-windows-msvc --test runner_windows_protocol_contract -- --nocapture

      - name: Qualify Windows actual generated tree output
        run: python scripts/run-required-test.py --label "Windows actual generated tree output" -- cargo test --locked -p adze-cli --target x86_64-pc-windows-msvc --test cli_test test_parse_static_tree_mode_emits_document_backed_tree -- --exact --nocapture

      - name: Qualify Windows actual generated document projections
        run: python scripts/run-required-test.py --label "Windows actual generated document projections" -- cargo test --locked -p adze-cli --target x86_64-pc-windows-msvc --test cli_test test_parse_document_projection_modes_emit_schema_envelopes -- --exact --nocapture

      - name: Qualify Windows actual generated recovery diagnostics
        run: python scripts/run-required-test.py --label "Windows actual generated recovery diagnostics" -- cargo test --locked -p adze-cli --target x86_64-pc-windows-msvc --test cli_test parse_document_json_modes_emit_recovery_diagnostics -- --exact --nocapture

      - name: Qualify Windows actual generated child argv rejection
        run: python scripts/run-required-test.py --label "Windows actual generated child argv rejection" -- cargo test --locked -p adze-cli --target x86_64-pc-windows-msvc --bin adze generated_runner_argv_tests::test_generated_runner_protocol_args_precede_input_io -- --exact --nocapture

      - name: Strict Clippy for native Windows release command journal
        run: cargo clippy --locked -p xtask --target x86_64-pc-windows-msvc --test local_release_command_contract -- -D warnings

      - name: Qualify Windows release command journal data
        run: python scripts/run-required-test.py --label "Windows release command journal data" -- cargo test --locked -p xtask --target x86_64-pc-windows-msvc --test local_release_command_contract -- --nocapture

      - name: Strict Clippy for Windows Cargo lock assumption fixture
        run: cargo clippy --locked -p xtask --target x86_64-pc-windows-msvc --bin xtask --tests -- -D warnings

      - name: Qualify Windows actual Cargo lock and offline install assumptions
        run: python scripts/run-required-test.py --label "Windows Cargo lock and offline install assumptions" -- cargo test --locked -p xtask --target x86_64-pc-windows-msvc --bin xtask local_registry::provenance::tests::lock_fixture::test_actual_transformed_packaged_lock_prefetch_and_offline_install -- --exact --nocapture

      - name: Retain Windows Cargo lock assumption artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: cargo-lock-assumption-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adze-lock-fixture-*
          include-hidden-files: true
          if-no-files-found: error

  product-proof-result:
    timeout-minutes: 5
    name: Product Proof Result
    needs: [detect-stable-product-paths, pr-canary-plan, ci-product-stable, ci-product-windows]
    # Always evaluate (#995): a skipped required check satisfies branch
    # protection, so cancelled/failed/skipped prerequisites must reach
    # the evaluator and fail there instead of skipping this job.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
      # Two-tier meaning: on pull_request this is the cheap admission
      # signal (detection plus canary dry-run); otherwise it verifies
      # detection plus executed canaries. The evaluator enforces the
      # #995 truth table; only an explicit validated no-work decision
      # (detector success + run_stable=false + reason) may pass without
      # selected proof.
      - name: Aggregate Product Proof result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_RESULT: ${{ needs.detect-stable-product-paths.result }}
          RUN_STABLE: ${{ needs.detect-stable-product-paths.outputs.run_stable }}
          DETECT_REASON: ${{ needs.detect-stable-product-paths.outputs.reason }}
          STABLE_RESULT: ${{ needs.ci-product-stable.result }}
          WINDOWS_RESULT: ${{ needs.ci-product-windows.result }}
          PR_CANARY_RESULT: ${{ needs.pr-canary-plan.result }}
        run: python3 scripts/evaluate-required-result.py product

  ci-product:
    timeout-minutes: 30
    name: ci-product advisory canaries
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'all')
    # Advisory lane also runs GitHub-hosted; there is no self-hosted fleet.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Ensure workspace toolchain has WASM target
        run: |
          TOOLCHAIN="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup target add --toolchain "$TOOLCHAIN" wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Show canary plan (dry-run)
        run: scripts/ci-product.sh --dry-run

      - name: Run ci-product advisory lane
        run: scripts/ci-product.sh
