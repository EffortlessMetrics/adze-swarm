name: Pure Rust Implementation CI

# Default code-path PR runs Ubuntu/stable only. Docs/policy-only PRs skip the
# Rust jobs. Excluded tool islands such as tools/ts-bridge are owned by their
# focused smoke lanes instead of the whole-workspace Pure Rust lane. The full
# OS × toolchain matrix runs on workflow_dispatch and on PRs labeled
# 'platform-matrix' or 'full-ci'. See docs/ci/adze-rollout-plan.md (PR 13).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2
  RAYON_NUM_THREADS: 4
  TOKIO_WORKER_THREADS: 2
  TOKIO_BLOCKING_THREADS: 8
  CARGO_BUILD_JOBS: 2
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

jobs:
  matrix-setup:
    name: Matrix Setup
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'full-ci' ||
      github.event.label.name == 'platform-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      os: ${{ steps.compute.outputs.os }}
      rust: ${{ steps.compute.outputs.rust }}
      rust_changed: ${{ steps.compute.outputs.rust_changed }}
      run_rust: ${{ steps.compute.outputs.run_rust }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - id: compute
        run: |
          set -euo pipefail
          full=false
          rust_changed=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            full=true
            rust_changed=true
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" == "true" ]] \
            || [[ "${{ contains(github.event.pull_request.labels.*.name, 'platform-matrix') }}" == "true" ]]; then
            full=true
            rust_changed=true
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)
            if echo "$changed" | grep -qE '^(Cargo\.toml|Cargo\.lock)$|^(runtime/|runtime2/|macro/|common/|ir/|glr-core/|tablegen/|crates/|grammars/|tool/|cli/|xtask/|tests/|testing/|glr-test-support/|test-mini/|lsp-generator/|playground/|wasm-demo/|\.github/workflows/pure-rust-ci\.yml$)'; then
              rust_changed=true
            fi
          fi
          if [ "$full" = "true" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'rust=["stable","nightly"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'rust=["stable"]' >> "$GITHUB_OUTPUT"
          fi
          if [ "$rust_changed" = "true" ]; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_rust=false" >> "$GITHUB_OUTPUT"
          fi
          echo "rust_changed=$rust_changed" >> "$GITHUB_OUTPUT"
          echo "Rust jobs selected: $rust_changed"

  test-pure-rust:
    name: Test Pure Rust Implementation
    needs: matrix-setup
    if: needs.matrix-setup.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.matrix-setup.outputs.os) }}
        rust: ${{ fromJson(needs.matrix-setup.outputs.rust) }}

    defaults:
      run:
        shell: bash
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    
    - name: Check formatting
      if: matrix.os != 'windows-latest'
      run: cargo fmt --all -- --check
    
    - name: Clippy (default features)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Clippy (tree-sitter-c2rust)
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      run: cargo clippy -p adze --lib --no-default-features --features tree-sitter-c2rust -- -D warnings
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run supported crate tests
      if: |
        github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'full-ci')
      timeout-minutes: 25
      run: |
        cargo test \
          -p adze \
          -p adze-macro \
          -p adze-tool \
          -p adze-common \
          -p adze-ir \
          -p adze-glr-core \
          -p adze-tablegen \
          --lib --tests --bins \
          -- --test-threads=$RUST_TEST_THREADS

    - name: Run full workspace tests
      if: |
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      timeout-minutes: 25
      run: cargo test --verbose -- --test-threads=$RUST_TEST_THREADS

    - name: Skip benchmark compile check on pull requests
      if: matrix.os != 'windows-latest' && github.event_name == 'pull_request'
      run: |
        echo "::notice::Skipping all-crate benchmark compile check on pull_request events."
        echo "::notice::Benchmark compile coverage is owned by criterion-smoke.yml and manual/full-CI lanes."
    
    - name: Run benchmark compile check (all crates)
      if: matrix.os != 'windows-latest' && github.event_name != 'pull_request'
      run: |
        start=$SECONDS
        cargo bench --no-run
        echo "Benchmark compile check elapsed: $((SECONDS - start))s"

    - name: Run focused benchmark compile check (runtime only) on Windows
      if: matrix.os == 'windows-latest'
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "::notice::Skipping Windows benchmark compile check on pull_request events (non-blocking, no-signal path)."
          echo "Benchmark compile check elapsed: skipped"
          exit 0
        fi

        start=$SECONDS
        cargo bench -p adze --bench simple_bench --no-run
        elapsed=$((SECONDS - start))
        echo "Benchmark compile check elapsed: ${elapsed}s"
        if [[ "$elapsed" -gt 600 ]]; then
          echo "::warning::Windows benchmark compile tail took ${elapsed}s on ${{ matrix.rust }}."
        fi
  
  test-wasm:
    name: Test WASM Build
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'wasm') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    
    - name: Build WASM
      run: |
        cd runtime
        wasm-pack build --target web --features wasm --no-default-features
    
    - name: Check WASM size
      run: |
        ls -lh runtime/pkg/*.wasm
        size=$(stat -c%s runtime/pkg/*_bg.wasm)
        echo "WASM size: $size bytes"
        if [ $size -gt 1048576 ]; then
          echo "Warning: WASM size exceeds 1MB"
        fi
  
  golden-tests:
    name: Golden Tests
    # The dedicated golden-tests.yml workflow is the PR-default; this job
    # runs on workflow_dispatch/full-ci to keep the integrated path covered.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:golden') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Tree-sitter CLI
      run: |
        npm install -g tree-sitter-cli
        tree-sitter --version
    
    - name: Run golden tests
      run: |
        cd runtime
        cargo test --test golden_tests -- --ignored
    
    - name: Upload golden test results
      if: failure()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: golden-test-failures
        path: runtime/tests/golden/*.diff
  
  integration-tests:
    name: Integration Tests
    needs: matrix-setup
    if: needs.matrix-setup.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Test with c2rust backend
      run: |
        cargo test -p adze --no-default-features --features tree-sitter-c2rust --lib
  
  performance:
    name: Performance Regression Tests
    # Benchmark proof is explicit. This integrated job runs on workflow_dispatch/full-ci.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:perf') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Run benchmarks
      run: |
        cd runtime
        cargo bench --features unstable-benches | tee bench_results.txt
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v7.0.0
      with:
        name: benchmark-results
        path: runtime/bench_results.txt
    
    - name: Check for performance regression
      run: |
        # Simple check - could be enhanced with historical comparison
        if grep -q "slower" runtime/bench_results.txt; then
          echo "Potential performance regression detected"
          exit 1
        fi
