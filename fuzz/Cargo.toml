[package]
name = "adze-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95.0"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
adze = { path = "../runtime" }
glr-test-support = { path = "../glr-test-support" }
adze-glr-core = { path = "../glr-core" }
adze-linecol-core = { path = "../crates/linecol-core" }
adze-stack-pool-core = { path = "../crates/stack-pool-core" }
adze-ts-format-core = { path = "../crates/ts-format-core" }
adze-common = { path = "../common" }
adze-common-type-ops-core = { path = "../crates/common-type-ops-core" }
adze-parser-backend-core = { path = "../crates/parser-backend-core" }
quote = "1"
syn = { version = "2", features = [ "full", "extra-traits" ] }

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false

[[bin]]
name = "fuzz_parser"
