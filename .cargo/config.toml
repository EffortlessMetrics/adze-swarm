# Cargo configuration for adze

[build]
# Number of parallel jobs, defaults to # of CPUs (0 is invalid, remove to use default)
rustflags = [
  "--check-cfg=cfg(feature, values(\"perf-counters\",\"test-api\",\"strict-invariants\",\"memory-tests\",\"json-parity\",\"with-grammars\",\"external_scanners\",\"incremental_glr\",\"strict_docs\"))",
  # `-Awarnings` silences ALL compiler warnings for plain local `cargo build` /
  # `cargo check`. It is a deliberate workaround for Node-wrapper crashes on
  # noisy output (see the `[term]` quieting below), NOT a signal that warnings
  # are unimportant. It intentionally diverges from CI and pre-commit, which run
  # with `-D warnings`, so a clean local build does NOT mean the code is
  # warning-free — surface the real warnings before pushing with one of:
  #   cargo ci        # the clippy `-D warnings` alias defined below
  #   just clippy     # lint the core crates with `-D warnings`
  #   just pre        # run the pre-commit checks locally
  "-Awarnings"
]

[term]
# Quiet terminal output to prevent Node wrapper crashes from excessive output
color = "never"
progress.when = "never"

[patch.crates-io]
# Let `cargo package -p adze-cli --allow-dirty` verify before the matching
# unpublished adze-tool crate exists on crates.io. Published manifests still
# carry the normal version requirement; this is workspace verification config.
adze-tool = { path = "tool" }

[profile.dev]
# Faster compilation at the cost of runtime performance
opt-level = 0
debug = true
incremental = true

# Fast iteration profile - minimal debug info for quicker builds
[profile.dev-fast]
inherits = "dev"
opt-level = 1
debug = 1  # Line tables only (faster builds)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

# Profile for CI builds - faster than release but still optimized
[profile.ci]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16

# Profile for fuzzing
[profile.fuzz]
inherits = "dev"
opt-level = 3
overflow-checks = false

[target.x86_64-unknown-linux-gnu]
# Use mold linker on Linux for faster builds (if available)
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# Useful aliases
xtask = "run --package xtask --"
lint = "xtask lint"
ci = "clippy --workspace --all-targets --all-features -- -D warnings"
test-all = "test --workspace --all-features"
# Fixed recursive alias - renamed to 'nxt' to avoid shadowing
nxt = "nextest run --workspace --all-features"

# Concurrency-capped test aliases
t2 = "test -- --test-threads=2"
t1 = "test -- --test-threads=1"
t4 = "test -- --test-threads=4"
test-safe = "test -- --test-threads=2"
test-ultra-safe = "test -- --test-threads=1"
