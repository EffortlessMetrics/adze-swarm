[package]
name = "adze-glr-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.95.0"
description = "GLR parser generation algorithms for pure-Rust Tree-sitter"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/effortlessmetrics/adze"
homepage = "https://github.com/effortlessmetrics/adze"
documentation = "https://docs.rs/adze-glr-core"
readme = "README.md"
publish = true
include = ["Cargo.toml", "LICENSE*", "README*", "src/**"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
adze-ir = { version = "0.9.0", path = "../ir" }
indexmap = { workspace = true, features = ["serde"] }
fixedbitset = { version = "0.5", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }
typed-arena = "2.0"

# Optional parallel processing
rayon = { workspace = true, optional = true }
rustc-hash = { workspace = true }
smallvec.workspace = true
postcard = { version = "1.0", features = ["use-std"], optional = true }

[features]
default = []
parallel = ["rayon"]
strict_docs = []
strict_api = []
glr_trace = []
glr-trace = ["glr_trace"]  # Deprecated alias
test_helpers = []
test-helpers = ["test_helpers"]  # Deprecated alias
strict-invariants = []
memory-tests = []
json-parity = []
perf_counters = []
perf-counters = ["perf_counters"]  # Deprecated alias
test-api = []
debug_glr = [] # Enable debug output for GLR parser
serialization = [
    "dep:postcard",
] # Enable serialization support (used by runtime2)
glr_telemetry = [] # Enable GLR telemetry (used by benchmarks)

[dev-dependencies]
insta = { workspace = true }
criterion.workspace = true
dhat = "0.3"
serde_json = { workspace = true }
proptest = { workspace = true }
glr-test-support = { path = "../glr-test-support" }
trybuild = "1"
adze-bdd-governance-core = { version = "0.1.0", path = "../crates/bdd-governance-core" }
adze-tablegen = { version = "0.9.0", path = "../tablegen" }
indexmap = { workspace = true, features = ["serde"] }

[[bench]]
name = "automaton"
harness = false

[[bench]]
name = "perf_snapshot"
harness = false
