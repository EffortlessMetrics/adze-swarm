[package]
name = "adze-macro"
version = "0.9.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Steven Zimmerman, CPA"]
description = "Procedural macros for defining tree-sitter grammars alongside Rust logic"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/effortlessmetrics/adze"
homepage = "https://github.com/effortlessmetrics/adze"
documentation = "https://docs.rs/adze-macro"
readme = "README.md"
publish = true
keywords = ["parsing", "codegen", "grammar", "proc-macro"]
categories = ["development-tools"]
include = ["Cargo.toml", "LICENSE*", "README*", "src/**"]

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true
path = "src/lib.rs"

[features]
pure-rust = []
strict_docs = [] # Enable strict documentation requirements

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
adze-common = { version = "0.9.0", path = "../common" }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
trybuild = "1.0"
proptest = { workspace = true }
