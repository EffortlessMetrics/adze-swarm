[package]
name = "adze-cli"
version = "0.10.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Steven Zimmerman, CPA"]
description = "Command-line tools for Adze grammar development and validation"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/effortlessmetrics/adze"
homepage = "https://github.com/effortlessmetrics/adze"
documentation = "https://docs.rs/adze-cli"
readme = "README.md"
publish = true
keywords = ["parsing", "codegen", "grammar", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "LICENSE*", "README*", "src/**", "tests/**"]

[[bin]]
name = "adze"
path = "src/main.rs"

[features]
dynamic = ["libloading"]

[dependencies]
clap.workspace = true
adze-tool = { version = "0.10.0", path = "../tool" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
syn = { workspace = true, features = ["visit"] }
colored = "3.0"
anyhow.workspace = true
env_logger = "0.11"
log = "0.4"
walkdir = "2.5"
notify = "8"
tempfile.workspace = true
sha2.workspace = true
libloading = { version = "0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
sha2 = "0.10"
