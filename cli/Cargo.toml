[package]
name = "adze-cli"
version = "0.8.0-dev"
edition = "2024"
rust-version = "1.95.0"
authors = ["Steven Zimmerman, CPA"]
description = "Command-line tools for Adze grammar development and validation"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/effortlessmetrics/adze"
homepage = "https://github.com/effortlessmetrics/adze"
documentation = "https://docs.rs/adze-cli"
readme = "README.md"
publish = true
keywords = ["parsing", "codegen", "grammar", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "LICENSE*", "README*", "src/**", "tests/**"]

[[bin]]
name = "adze"
path = "src/main.rs"

[features]
dynamic = ["libloading"]

[dependencies]
clap.workspace = true
adze-tool = { version = "0.8.0-dev", path = "../tool" }
serde_json.workspace = true
syn.workspace = true
colored = "3.0"
anyhow.workspace = true
env_logger = "0.11"
log = "0.4"
walkdir = "2.5"
notify = "8"
tempfile.workspace = true
libloading = { version = "0.8", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
