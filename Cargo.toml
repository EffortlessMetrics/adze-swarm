[workspace]
resolver = "2"
members = [
  "macro",
  "runtime",
  "runtime2",
  "crates/parsetable-metadata",
  "crates/linecol-core",
  "crates/bdd-governance-core",
  "crates/common-type-ops-core",
  "tool",
  "common",
  "ir",
  "glr-core",
  "glr-test-support",
  "tablegen",
  "xtask",
  "testing",
  "grammars/javascript",
  "grammars/python",
  "grammars/python-simple",
  "grammars/test-vec-wrapper",
  "grammars/go",
  "lsp-generator",
  "playground",
  "samples/downstream-demo",
  "cli",
  "benchmarks",
  "test-mini",
  "golden-tests",
  "wasm-demo",
  "tests/governance",
]
# These crates are intentionally excluded from default workspace commands
# due to mutually exclusive features. Build them explicitly with -p when needed.
exclude = [
  "runtime/fuzz",
  "tools/ts-bridge",     # build separately to enable grammar features
  "crates/ts-c-harness", # relies on external C/TS libs
  "example",             # has mutually exclusive pure-rust/c-backend features
]


[workspace.package]
authors = ["Steven Zimmerman, CPA <git@effortlesssteven.com>"]
documentation = "https://github.com/effortlessmetrics/adze"
edition = "2024"
homepage = "https://github.com/effortlessmetrics/adze"
license = "Apache-2.0 OR MIT"
publish = false
repository = "https://github.com/effortlessmetrics/adze"
rust-version = "1.95.0"


[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"
unused_extern_crates = "deny"
unexpected_cfgs = "warn"
const_item_interior_mutations = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
decimal_bitwise_operands = "warn"
disallowed_fields = "deny"
manual_checked_ops = "warn"
manual_ilog2 = "warn"
needless_type_cast = "warn"
same_length_and_capacity = "deny"

[workspace.dependencies]
tree-sitter = "=0.26.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
proptest = "1.4"
insta = "1.39"
criterion = { version = "0.8.2", features = ["html_reports"] }
thiserror = "2.0"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
anyhow = "1.0"
tempfile = "3"
indexmap = "2.0"
postcard = { version = "1.1", features = ["use-std"] }
clap = { version = "4.6", features = ["derive"] }
rayon = "1.10"
rustc-hash = "2.1"
smallvec = "1.13"
regex = "1.11"

[profile.ci]
inherits = "dev"
debug = 0
lto = "off"
